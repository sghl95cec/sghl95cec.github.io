 anticoagulation per the PE protocol unless contraindicated, echo for a strained right ventricle, CT pulmonary angiography; refer. Shock with suspected PE is high-risk PE: thrombolysis is a senior decision.","outcome":"Referred: possible PE","src":["ESC23-ACS|Differential diagnosis","AHA25-SPEC|§20.2 (fibrinolysis in PE)"]},"c_ecg":{"help":"STEMI: new ST elevation at the J point in 2 neighbouring leads, 1 mm or more (V2-V3: 2 mm men 40 or over, 2.5 mm men under 40, 1.5 mm women). Equivalents: posterior MI, new LBBB / paced rhythm with ongoing ischaemia. ST elevation in aVR with widespread ST depression: urgent angiography.","type":"q","text":"What does the ECG show?","ans":[["ST elevation in 2 neighbouring leads (STEMI) or a STEMI equivalent","c_stemi"],["ST depression, T inversion, or changes that come and go","n_risk"],["Normal or not diagnostic","n_poss"]],"src":["ESC23-ACS|ECG criteria (STEMI, NSTE-ACS)"]},"c_stemi":{"type":"dx","dx":"stemi","next":"s_onset"},"s_onset":{"type":"q","text":"When did the pain start?","ans":[["Within the last 12 hours","s_asp"],["12-48 hours ago, still pain, heart failure, shock or arrhythmia","s_asp_l1"],["12-48 hours ago, now pain-free and stable","s_asp_l2"],["More than 48 hours ago, pain-free","s_late"]],"src":["ESC23-ACS|Reperfusion: within 12 h; over 12 h with ongoing ischaemia primary PCI; 12-48 h routine PCI (IIa)"]},"s_asp":{"src":["ESC23-ACS|Aspirin for all ACS","ACCAHA25-ACS|Aspirin"],"type":"drug","text":"Aspirin now (once aortic dissection is not suspected).","chain":["aspirin","@refer_nicvd"],"next":"s_supp"},"s_supp":{"type":"q","text":"Also now: oxygen only if SpO2 under 90%; defibrillator pads ready; send the ECG to NICVD. Pain?","ans":[["Ongoing pain: give a nitrate / pain relief","s_gtn"],["No pain now","s_pci"]],"src":["ESC23-ACS|Oxygen if SpO2 below 90%; nitrates and opioids for pain"]},"s_gtn":{"src":["ESC23-ACS|Nitrates; titrated IV opioids for severe pain"],"type":"drug","text":"Pain relief: nitrate first (not if SBP under 90, right ventricular infarction or recent sildenafil / tadalafil), then morphine if needed.","chain":["gtn_sl","gtn_iv","morphine","@refer_nicvd"],"next":"s_pci"},"s_pci":{"help":"Count the call, loading the ambulance, the drive in today's traffic and the cath lab team arriving.","type":"q","text":"Call NICVD now. Can the patient reach NICVD and have primary PCI within 120 minutes of this STEMI diagnosis?","ans":[["Yes: within 120 minutes","s_ppci"],["No, or not sure","s_pregif"]],"src":["ESC23-ACS|Primary PCI if it can be done within 120 min of diagnosis; otherwise fibrinolysis within 10 min","ACCAHA25-ACS|Reperfusion strategy (PCI within 120 min of first medical contact)"]},"s_pregif":{"type":"if","cond":"preg","yes":"s_preg","no":"s_cx"},"s_preg":{"type":"q","text":"Pregnant: primary PCI is preferred; fibrinolysis only if PCI cannot be done in time (pregnancy is a relative contraindication). Senior and obstetrician decide.","ans":[["Transfer for PCI","s_ppci"],["Fibrinolysis decided","s_cx"]],"src":["ESC25-PREG|§12.2.1.2 (systemic thrombolysis if timely PCI is not available)"]},"s_ppci":{"type":"q","text":"Primary PCI at NICVD. Has NICVD asked you to give a P2Y12 drug or heparin before transfer?","ans":[["Yes: a P2Y12 drug","s_p2"],["Yes: heparin only","s_ufh"],["No: transfer now","s_xfer"]],"src":["ESC23-ACS|Pretreatment with a P2Y12 inhibitor before primary PCI may be considered (IIb)"]},"s_p2":{"src":["ESC23-ACS|P2Y12 loading doses"],"type":"drug","text":"P2Y12 drug as NICVD advises:","chain":["ticagrelor","clopidogrel_pci","@refer_nicvd"],"next":"s_p2h"},"s_p2h":{"type":"q","text":"Heparin too (only if NICVD asked)?","ans":[["Yes","s_ufh"],["No: transfer now","s_xfer"]],"src":["ESC23-ACS|Anticoagulation during primary PCI"]},"s_ufh":{"src":["ESC23-ACS|UFH 70-100 IU/kg in primary PCI"],"type":"drug","text":"Heparin before transfer (only if NICVD asked):","chain":["ufh_pci","@refer_nicvd"],"next":"s_xfer"},"s_xfer":{"type":"end","text":"Transfer to NICVD now: doctor, monitor, defibrillator, oxygen; the ECGs and this record (times of every drug).","outcome":"Referred to NICVD (primary PCI)","src":["ESC23-ACS|Transfer for PCI","ACCAHA25-ACS|Systems of care"]},"s_cx":{"rules":[{"any":"abs","to":"s_cx_no"},{"any":"rel","to":"s_cx_rel"}],"else":"s_lysis","type":"check","text":"Fibrinolysis: tick every contraindication present.","list":"lysis_cx","src":["ESC23-ACS|Contraindications to fibrinolysis"]},"s_cx_no":{"type":"do","text":"Fibrinolysis is contraindicated: transfer to NICVD for PCI even if it takes longer.","next":"s_xfer","src":["ESC23-ACS|Absolute contraindications"]},"s_cx_rel":{"type":"q","text":"Relative contraindication: the senior weighs the benefit against the bleeding risk. If NICVD PCI is possible even with delay, transfer may be safer.","ans":[["Give fibrinolysis","s_lysis"],["Transfer for PCI","s_xfer"]],"src":["ESC23-ACS|Relative contraindications"]},"s_lysis":{"src":["ESC23-ACS|Fibrinolysis within 12 h of symptoms when primary PCI cannot be done within 120 min; start within 10 min; fibrin-specific agent preferred","ACCAHA25-ACS|Fibrinolytic therapy"],"type":"drug","text":"Fibrinolysis within 10 minutes of the STEMI diagnosis (pain within 12 hours). First available agent:","chain":["tenecteplase","alteplase_mi","reteplase","streptokinase","@refer_nicvd"],"next":"s_l_ap"},"s_l_ap":{"src":["ESC23-ACS|Clopidogrel with fibrinolysis"],"type":"drug","text":"With fibrinolysis: clopidogrel (with the aspirin already given).","chain":["clopidogrel_lysis","@refer_nicvd"],"next":"s_l_ac"},"s_l_ac":{"src":["ESC23-ACS|Anticoagulation with fibrinolysis until revascularisation (up to 8 days)"],"type":"drug","text":"With fibrinolysis: anticoagulant (UFH is the CEC's usual drug).","chain":["ufh_lysis","enox_lysis","fonda_lysis","@refer_nicvd"],"next":"s_l_watch"},"s_l_watch":{"type":"q","text":"60-90 minutes after the fibrinolytic: has the ST elevation fallen by more than half, with the pain gone?","ans":[["Yes: successful","s_l_ok"],["No: failed, or shock / pain returns","s_rescue"]],"src":["ESC23-ACS|Assess ST resolution at 60-90 min; rescue PCI if it fails"]},"s_l_ok":{"type":"end","text":"Successful: transfer to NICVD for angiography within 2-24 hours.","outcome":"Lysed; referred to NICVD","src":["ESC23-ACS|Angiography 2-24 h after successful fibrinolysis"]},"s_rescue":{"type":"end","text":"Failed fibrinolysis: immediate transfer to NICVD for rescue PCI.","outcome":"Referred for rescue PCI","src":["ESC23-ACS|Rescue PCI"]},"s_asp_l1":{"src":["ESC23-ACS|Aspirin"],"type":"drug","text":"Aspirin now.","chain":["aspirin","@refer_nicvd"],"next":"s_late1"},"s_late1":{"type":"end","text":"Over 12 hours with ongoing ischaemia, heart failure, shock or arrhythmia: primary PCI is still indicated. Refer to NICVD now. No fibrinolysis.","outcome":"Referred to NICVD","src":["ESC23-ACS|Over 12 h with ongoing symptoms: primary PCI (class I)"]},"s_asp_l2":{"src":["ESC23-ACS|Aspirin"],"type":"drug","text":"Aspirin now.","chain":["aspirin","@refer_nicvd"],"next":"s_late2"},"s_late2":{"type":"end","text":"12-48 hours, pain-free and stable: refer to NICVD for angiography / PCI (within 12-48 hours).","outcome":"Referred to NICVD","src":["ESC23-ACS|Routine PCI 12-48 h (IIa)"]},"s_late":{"type":"end","text":"Over 48 hours and pain-free: no emergency reperfusion. Refer to NICVD / cardiology for assessment.","outcome":"Referred to cardiology","src":["ESC23-ACS|Late presenters"]},"n_risk":{"type":"q","text":"Any very-high-risk feature? Shock or low BP; pain that keeps coming back or does not settle; life-threatening arrhythmia or arrest; acute heart failure; ST elevation that comes and goes.","ans":[["Yes","n_vhr"],["No","n_asp"]],"src":["ESC23-ACS|Very high-risk NSTE-ACS: immediate invasive strategy (within 2 h)"]},"n_vhr":{"src":["ESC23-ACS|Immediate invasive strategy"],"type":"drug","text":"Very high risk: immediate angiography (within 2 hours). Aspirin, then transfer to NICVD now.","chain":["aspirin","@refer_nicvd"],"next":"s_xfer"},"n_asp":{"src":["ESC23-ACS|Aspirin for NSTE-ACS"],"type":"drug","text":"Aspirin:","chain":["aspirin","@refer_nicvd"],"next":"n_ac"},"n_ac":{"sets":["acg"],"src":["ESC23-ACS|Parenteral anticoagulation for all NSTE-ACS at diagnosis"],"type":"drug","text":"Anticoagulant (UFH is the CEC's usual drug):","chain":["ufh_nste","enox_nste","fonda_nste","@refer_nicvd"],"next":"n_pain"},"n_pain":{"type":"q","text":"Ongoing pain?","ans":[["Yes","n_gtn"],["No","n_serial"]],"src":["ESC23-ACS|Nitrates for ongoing pain"]},"n_gtn":{"src":["ESC23-ACS|Nitrates; titrated IV opioids"],"type":"drug","text":"Pain relief:","chain":["gtn_sl","gtn_iv","morphine","@refer_nicvd"],"next":"n_serial"},"n_poss":{"type":"q","text":"Could this still be ACS (typical pain, risk factors, age)?","ans":[["Yes, possible","n_asp_p"],["No: another cause is clear","n_other"]],"src":["ESC23-ACS|Working diagnosis of NSTE-ACS"]},"n_asp_p":{"src":["ESC23-ACS|Aspirin"],"type":"drug","text":"Aspirin (unless contraindicated) while you repeat the ECG:","chain":["aspirin","@refer_nicvd"],"next":"n_serial"},"n_serial":{"type":"q","text":"No troponin test at the CEC. Repeat the ECG every 15-30 minutes while there is pain, and at once if pain returns. What does the repeat ECG show?","ans":[["New ST elevation","c_stemi"],["New or changing ST depression / T changes","n_dyn"],["No change, but ACS is still possible","n_trop"],["Another cause is clear","n_other"]],"src":["ESC23-ACS|Repeat ECG in recurrent symptoms or diagnostic uncertainty","UDMI5|Troponin is needed to diagnose MI"]},"n_dyn":{"type":"if","cond":"acg","yes":"n_early","no":"n_ac2"},"n_ac2":{"sets":["acg"],"src":["ESC23-ACS|Anticoagulation"],"type":"drug","text":"Dynamic ECG changes: start the anticoagulant now.","chain":["ufh_nste","enox_nste","fonda_nste","@refer_nicvd"],"next":"n_early"},"n_early":{"type":"end","text":"Dynamic ECG changes = high risk: early invasive strategy (within 24 hours). Refer to NICVD today.","outcome":"Referred to NICVD (early invasive)","src":["ESC23-ACS|High-risk NSTE-ACS: early invasive strategy within 24 h"]},"n_trop":{"type":"end","text":"ACS cannot be ruled out here (no troponin): refer to NICVD (or a hospital with high-sensitivity troponin) today. Do not send home.","outcome":"Referred for troponin","src":["ESC23-ACS|Rule-in / rule-out needs troponin","UDMI5|Definition of myocardial injury and MI (troponin)"]},"n_other":{"type":"end","text":"Treat the other cause; if pain returns, repeat the ECG at once.","outcome":"Other cause","src":["ESC23-ACS|Differential diagnosis"]}}},"hf":{"title":"Heart failure: pulmonary oedema and cardiogenic shock","sub":"Decompensated HF (ESC 2026)","start":"h_pt","steps":{"h_pt":{"type":"pt","ask":["preg","age","wt","ckd"],"next":"h_type"},"h_type":{"type":"q","text":"Main picture?","ans":[["Breathless with crackles; BP normal or high (acute pulmonary oedema)","h_apo"],["Low BP (SBP under 90) with cold, clammy skin, confusion or little urine (cardiogenic shock)","h_shock"],["Swelling and breathlessness worsening over days; BP normal (congestion)","h_cong"]],"src":["ESC26-HF|Section 7: clinical presentations of decompensated HF"]},"h_apo":{"bullets":[{"if":"preg","t":"Pregnant or recently delivered: think of peripartum cardiomyopathy and pre-eclampsia; no ACE inhibitor, ARB or ARNI in pregnancy; call the obstetrician."}],"type":"do","text":"Now: sit upright, monitor, IV access, ECG (STEMI? arrhythmia?), bedside echo. Oxygen if SpO2 under 90%; CPAP / non-invasive ventilation if breathing fast (over 25) with SpO2 under 90%. Find the trigger: ACS, very high BP, arrhythmia, valve problem, infection, PE, missed medicines.","next":"h_bp","src":["ESC26-HF|Section 7, Figure 13: initial management of decompensated HF"]},"h_bp":{"type":"q","text":"Systolic BP now?","ans":[["Over 180 (hypertensive pulmonary oedema)","h_hi"],["110 to 180","h_diur"],["90 to 110","h_diur_lo"],["Under 90","h_shock"]],"src":["ESC26-HF|Figure 13: vasodilators when SBP > 110","ESC19-HTNEM|Pulmonary oedema: SBP below 140 at once"]},"h_hi":{"src":["ESC19-HTNEM|Acute cardiogenic pulmonary oedema: nitroglycerine or nitroprusside with a loop diuretic","AHAACC25-HBP|Section 6.2"],"type":"drug","text":"Hypertensive pulmonary oedema: bring SBP below 140 at once with a nitrate, plus the loop diuretic.","chain":["gtn_iv","gtn_sl","urapidil","nitroprusside","@nondrug_apo"],"next":"h_diur_hi"},"h_diur_hi":{"src":["ESC26-HF|IV loop diuretic"],"type":"drug","text":"Loop diuretic:","chain":["furosemide","@nondrug_apo"],"next":"h_resp"},"h_diur":{"src":["ESC26-HF|Section 7: IV loop diuretics"],"type":"drug","text":"Loop diuretic IV:","chain":["furosemide","@nondrug_apo"],"next":"h_vaso"},"h_vaso":{"src":["ESC26-HF|Figure 13: consider vasodilators when SBP > 110 mmHg"],"type":"drug","text":"SBP over 110: add a nitrate (vasodilator).","chain":["gtn_iv","gtn_sl","@nondrug_apo"],"next":"h_resp"},"h_diur_lo":{"src":["ESC26-HF|Check frequently for hypotension / hypoperfusion"],"type":"drug","text":"SBP 90-110: loop diuretic only (no nitrate); watch the BP.","chain":["furosemide","@nondrug_apo"],"next":"h_resp"},"h_cong":{"src":["ESC26-HF|Decongestion"],"type":"drug","text":"Congestion: loop diuretic IV.","chain":["furosemide","@nondrug_apo"],"next":"h_resp"},"h_resp":{"type":"q","text":"After 1-2 hours: good urine (over 100-150 mL/hour) and breathing better?","ans":[["Yes","h_ok"],["No","h_poor"]],"src":["ESC26-HF|Assess diuretic response (urine output; urinary sodium-guided therapy IIb)","ESC21-HF|Poor response: urine output below 100 mL/h in the first 6 hours"]},"h_ok":{"type":"end","text":"Responding. Continue; when stable restart / start the heart failure medicines, including an SGLT2 inhibitor in hospital (ESC 2026 class I).","outcome":"Improving","src":["ESC26-HF|In-hospital SGLT2 inhibitor after stabilisation (class I)"]},"h_poor":{"type":"end","text":"Poor response: double the IV loop diuretic; consider adding acetazolamide or a thiazide; check for low BP / poor perfusion (shock); refer to CCU (NICVD).","outcome":"Referred to CCU","src":["ESC26-HF|Combination diuretics; escalation"]},"h_shock":{"type":"do","text":"Cardiogenic shock: ECG (STEMI: urgent PCI, refer to NICVD now); bedside echo (mechanical complication, tamponade, right ventricular infarct). Fluid 200-250 mL over 15-30 min only if no congestion. Then a vasopressor; transfer to NICVD (Shock Team).","next":"h_press","src":["ESC26-HF|Cardiogenic shock; Shock Team (class I)","ESC21-HF|Fluid challenge (200 mL or more over 15-30 min) if no overt fluid overload","ACCAHA25-ACS|Cardiogenic shock: prompt revascularisation"]},"h_press":{"src":["ESC21-HF|Vasopressor doses","ESC26-HF|Cardiogenic shock"],"type":"drug","text":"Vasopressor for MAP 65 mmHg or more:","chain":["norepinephrine","epi_inf","dopamine","@pressor_none"],"next":"h_ino"},"h_ino":{"type":"q","text":"Still low output (cold, little urine) with MAP 65 or more?","ans":[["Yes: add an inotrope","h_dobu"],["No","h_shock_end"]],"src":["ESC26-HF|Inotropes for low output with hypoperfusion"]},"h_dobu":{"src":["ESC21-HF|Dobutamine 2-20 micrograms/kg/min"],"type":"drug","text":"Inotrope:","chain":["dobutamine","dopamine","@pressor_none"],"next":"h_shock_end"},"h_shock_end":{"type":"end","text":"Transfer to NICVD (Shock Team) with a doctor.","outcome":"Referred to NICVD","src":["ESC26-HF|Shock Team; temporary MCS in selected patients"]}}},"bp":{"title":"Very high blood pressure","sub":"Emergency vs urgency; dissection, pulmonary oedema, ACS, stroke, pregnancy","start":"p_pt","steps":{"p_pt":{"type":"pt","ask":["preg","age","wt","ckd","asthma","hfref"],"next":"p_conf"},"p_conf":{"type":"q","text":"Repeat the BP after 5 minutes of rest (correct cuff, both arms). Still 180/110 or more (160/110 or more if pregnant or recently delivered)?","ans":[["Yes","p_pregif"],["No","p_low"]],"src":["AHAACC25-HBP|Section 6.2 (above 180 and/or 120 with organ damage = emergency)","ESC25-PREG|§12.3.3 (severe: 160/110 or more)"]},"p_low":{"type":"end","text":"Not severe now: usual care and follow-up.","outcome":"Not severe","src":["ESC24-HTN|BP measurement"]},"p_pregif":{"type":"if","cond":"preg","yes":"p_preg","no":"p_tod"},"p_preg":{"type":"do","text":"Severe hypertension in pregnancy or after delivery: treat within 30-60 minutes and lower gradually to below 160/110 (not too fast). Continuous foetal monitoring. Call the obstetrician. Signs of pre-eclampsia (headache, visual change, upper abdominal pain, fits): magnesium sulfate.","next":"p_preg_d","src":["ESC25-PREG|§12.3.3 (admit; reduce gradually below 160/110; continuous CTG)","ACOG767|Treat within 30-60 minutes"]},"p_preg_d":{"result":[["BP now below 160/110","p_preg_mg"],["Still 160/110 or more","@next"]],"src":["ESC25-PREG|§12.3.3: oral nifedipine, labetalol or methyldopa; IV labetalol (or nicardipine); hydralazine second-line","ACOG767|Labetalol / nifedipine / hydralazine steps"],"type":"drug","text":"First available drug:","chain":["labetalol","nifedipine_po","hydralazine","nicardipine","@refer_obs"],"next":"p_preg_mg"},"p_preg_mg":{"type":"q","text":"Pre-eclampsia with severe features, or a fit?","ans":[["Yes","p_mg"],["No","p_preg_end"]],"src":["ESC25-PREG|§12.3.3.2 magnesium sulfate"]},"p_mg":{"src":["ESC25-PREG|§12.3.3.2"],"type":"drug","text":"Magnesium sulfate:","chain":["mgso4_eclampsia","@refer_obs"],"next":"p_preg_end"},"p_preg_end":{"type":"end","text":"Refer as an obstetric emergency with the drugs given written down.","outcome":"Obstetric referral","src":["ESC25-PREG|Pregnancy Heart Team"]},"p_tod":{"rules":[{"any":"aorta","to":"p_aorta"},{"any":"apo","to":"p_apo"},{"any":"acs","to":"p_acs"},{"any":"stroke","to":"p_stroke"},{"any":"enc","to":"p_emerg"},{"any":"sym","to":"p_sym"}],"else":"p_urg","type":"check","text":"Tick any sign of acute organ damage:","list":"tod","src":["AHAACC25-HBP|Section 6.2: hypertensive emergency = severe BP with acute target-organ damage"]},"p_urg":{"type":"end","text":"No acute organ damage: do NOT lower the BP quickly. Rest 30 minutes and recheck; restart or adjust oral medicines; review within days. Never sublingual nifedipine capsules.","outcome":"Severe hypertension without emergency","src":["AHAACC25-HBP|Severe hypertension without target-organ damage: no rapid lowering; oral therapy","ESC24-HTN|Hypertensive urgency"]},"p_emerg":{"type":"do","text":"Hypertensive emergency (encephalopathy, malignant hypertension, kidney injury): ICU care. Lower SBP by no more than 25% in the first hour, then to 160/100 over the next 2-6 hours, then to normal over 24-48 hours.","next":"p_emerg_d","src":["AHAACC25-HBP|Section 6.2 Rec 3","ESC19-HTNEM|Malignant hypertension / encephalopathy: MAP down 20-25%"]},"p_emerg_d":{"src":["ESC19-HTNEM|Labetalol or nicardipine first; nitroprusside or urapidil as alternatives"],"type":"drug","text":"Titratable IV drug:","chain":["labetalol","nicardipine","urapidil","nitroprusside","@bp_none"],"next":"p_icu"},"p_icu":{"type":"end","text":"Transfer to an ICU with titratable IV drugs and monitoring.","outcome":"Referred to ICU","src":["AHAACC25-HBP|ICU admission (class 1)"]},"p_aorta":{"warn":"No thrombolysis, no heparin, no aspirin.","type":"do","text":"Aortic dissection: heart rate under 60 and SBP under 120 within the first hour. Beta-blocker FIRST (before any vasodilator), pain relief, urgent CT, refer to NICVD (cardiac surgery). No fibrinolysis, anticoagulant or antiplatelet drug.","next":"p_ao_bb","src":["AHAACC25-HBP|Section 6.2: SBP below 120 in the first hour (aortic dissection)","ESC19-HTNEM|Acute aortic disease: SBP below 120, HR below 60; esmolol plus a vasodilator, or labetalol"]},"p_ao_bb":{"src":["ESC19-HTNEM|Esmolol (or labetalol / metoprolol)"],"type":"drug","text":"Beta-blocker first:","chain":["esmolol","labetalol","metoprolol_iv","@bp_none"],"next":"p_ao_vq"},"p_ao_vq":{"type":"q","text":"Heart rate now under 60 but SBP still 120 or more?","ans":[["Yes: add a vasodilator","p_ao_vd"],["No","p_ao_end"]],"src":["ESC19-HTNEM|Vasodilator after heart-rate control"]},"p_ao_vd":{"src":["ESC19-HTNEM|Nitroprusside, nitroglycerine or nicardipine"],"type":"drug","text":"Vasodilator:","chain":["gtn_iv","nicardipine","nitroprusside","@bp_none"],"next":"p_ao_end"},"p_ao_end":{"type":"end","text":"Refer to NICVD now (cardiac surgery) with BP control continued.","outcome":"Referred to NICVD","src":["AHAACC25-HBP|Acute aortic syndrome"]},"p_apo":{"src":["ESC19-HTNEM|Acute cardiogenic pulmonary oedema: SBP below 140 immediately","AHAACC25-HBP|Section 6.2"],"type":"drug","text":"Pulmonary oedema with high BP: SBP below 140 at once with a nitrate, plus a loop diuretic.","chain":["gtn_iv","gtn_sl","urapidil","nitroprusside","@nondrug_apo"],"next":"p_apo_d"},"p_apo_d":{"src":["ESC26-HF|IV loop diuretic"],"type":"drug","text":"Loop diuretic:","chain":["furosemide","@nondrug_apo"],"next":"p_apo_end"},"p_apo_end":{"type":"end","text":"Continue in the heart failure flow / CCU.","outcome":"Treated; CCU","src":["ESC26-HF|Section 7 (decompensated HF)"]},"p_acs":{"src":["ESC19-HTNEM|Acute coronary event: SBP below 140 immediately; nitroglycerine, labetalol"],"type":"drug","text":"ACS with high BP: SBP below 140 at once: nitrate or labetalol. Then follow the chest pain flow.","chain":["gtn_iv","labetalol","@bp_none"],"next":"p_acs_go"},"p_acs_go":{"type":"q","text":"Open the chest pain flow now?","ans":[["Yes: chest pain flow","acs:c_red"],["No: finish here","p_icu"]],"src":["ESC23-ACS|Management of ACS"]},"p_stroke":{"src":["ESC19-HTNEM|Stroke targets (ischaemic with / without thrombolysis; haemorrhagic)","ESC24-HTN|Acute stroke"],"type":"drug","text":"Stroke: refer to a stroke centre now (CT). Ischaemic and clot-busting planned: BP below 185/110 before and below 180/105 after; not planned: lower only if above 220/120, by about 15% in the first hour. Brain bleed with SBP over 180: lower to 130-180.","chain":["labetalol","nicardipine","urapidil","@bp_none"],"next":"p_str_end"},"p_str_end":{"type":"end","text":"Transfer to a stroke centre.","outcome":"Referred: stroke","src":["ESC24-HTN|BP management in acute stroke"]},"p_sym":{"src":["ESC19-HTNEM|Sympathomimetic crisis and pheochromocytoma: phentolamine; benzodiazepines; avoid beta-blockers alone"],"type":"drug","text":"Cocaine / amphetamine or pheochromocytoma: calm and sedate first (benzodiazepine); avoid a beta-blocker on its own (it can raise BP further). Phentolamine if available; otherwise a nitrate or nicardipine.","chain":["gtn_iv","nicardipine","urapidil","@bp_none"],"next":"p_icu"}}}},"code":{"cycleSec":120,"pauseMaxSec":10,"epiMinSec":180,"epiMaxSec":300,"epiShockAfter":2,"antiAfterShocks":[3,5],"compressorSec":120,"firstShockTargetSec":180,"energy":"Biphasic: the dose your defibrillator's maker advises (often 120-200 J); if unknown, the maximum. Monophasic: 360 J. Same or higher for later shocks.","cpr":["Push hard: at least 5 cm; push fast: 100-120 per minute; full recoil; minimal pauses.","No advanced airway: 30 compressions to 2 breaths.","Advanced airway: 1 breath every 6 seconds (10/min) with continuous compressions; waveform capnography.","Change the compressor every 2 minutes, or sooner if tired.","Access: IV first; IO if IV fails or is not possible (AHA 2025)."],"preg":["Manual left uterine displacement throughout CPR (when the top of the womb is at or above the umbilicus).","IV access above the diaphragm (arms).","Prepare for resuscitative delivery from the start: if no ROSC, deliver the baby aiming to finish by 5 minutes after the arrest.","Remove foetal monitors during CPR.","On IV magnesium sulfate: give calcium (10 mL calcium chloride 10% or 30 mL calcium gluconate 10%)."],"pregDeliverSec":240,"pregDeliverBySec":300,"src":["AHA25-ALS|Adult Cardiac Arrest Algorithm 2025 (CPR quality, shock energy, drug therapy, every 2 minutes)","ERC25-ALS|ALS algorithm","RCUK25|Adult ALS algorithm 2025","AHA25-SPEC|§19.3 cardiac arrest in pregnancy (left uterine displacement, delivery by 5 minutes, arm IV access, calcium with magnesium, no foetal monitoring)","ESC25-PREG|§12.4.4"],"epiNote":"AHA 2025: in VF / pVT give epinephrine after the first shocks fail (the algorithm shows it after the 2nd shock); in asystole / PEA as soon as possible; then every 3-5 minutes. ERC / RCUK 2025: after the 3rd shock in VF / pVT.","antiNote":"Amiodarone 300 mg (or lidocaine 1-1.5 mg/kg) after the 3rd shock; amiodarone 150 mg (or lidocaine 0.5-0.75 mg/kg) after the 5th.","other":["calcium_cl","calcium_gluc","bicarb","insulin_glu","mag_tdp","alteplase_pe"]},"practice":{"scenarios":[{"id":"vf1","title":"VF arrest in the CEC","mode":"code","story":"A 58-year-old man with chest pain collapses on the bed. No pulse. The monitor shows VF.","start":"VF","rules":[{"when":{"shocks":3,"anti":1},"rhythm":"Sinus rhythm 96/min, BP 92/60: ROSC","rosc":true}],"teach":["Shock at once for VF; CPR immediately after each shock.","Epinephrine after the 2nd shock (AHA), every 3-5 min.","Amiodarone 300 mg after the 3rd shock.","Rhythm checks every 2 minutes, pauses under 10 seconds."]},{"id":"pea_k","title":"PEA from hyperkalaemia (dialysis patient)","mode":"code","story":"A 45-year-old woman on dialysis missed two sessions, felt weak and collapsed. No pulse. Monitor: slow wide complexes.","start":"PEA (slow wide complexes)","rules":[{"when":{"drug":"calcium","epi":1,"hst":"hyperk"},"rhythm":"Sinus rhythm 80/min with peaked T waves, BP 100/60: ROSC","rosc":true}],"teach":["Non-shockable: epinephrine as soon as possible.","Think of Hs and Ts: hyperkalaemia in a dialysis patient.","Calcium, insulin with glucose, bicarbonate; then dialysis."]},{"id":"svt1","title":"Stable SVT","mode":"flow","flow":"tachy","story":"A 28-year-old woman with sudden palpitations for 40 minutes. BP 118/76, alert, no chest pain.","monitor":{"rhythm":"Regular narrow tachycardia 190/min","bp":"118/76","spo2":"98%"},"rules":[{"on":"adenosine","n":2,"set":{"rhythm":"Sinus rhythm 88/min","bp":"116/74"},"msg":"After 12 mg the monitor shows a few seconds of pause, then sinus rhythm."}],"want":["ans:t_stab=Stable","alt:vagal","drug:adenosine"],"wrong":["alt:sync_cv"],"teach":["Stable: vagal manoeuvre first, then adenosine 6 mg, then 12 mg."]},{"id":"chb1","title":"Unstable bradycardia: complete heart block","mode":"flow","flow":"brady","story":"A 68-year-old man feels faint. HR 32, BP 74/40, cold and clammy. ECG: complete heart block with wide escape.","monitor":{"rhythm":"Complete heart block, wide escape 32/min","bp":"74/40","spo2":"95%"},"rules":[{"on":"atropine","n":1,"set":{"rhythm":"Complete heart block 34/min","bp":"76/42"},"msg":"Little change after atropine (common in wide-escape complete block)."},{"on":"tcp|epi_inf|dopamine|isoprenaline","n":1,"set":{"rhythm":"Paced / faster rhythm 70/min","bp":"108/66"},"msg":"Heart rate and BP improve."}],"want":["ans:b_stab=Unstable","drug:atropine","any:alt:tcp|drug:epi_inf|drug:dopamine"],"teach":["Atropine first, but do not delay pacing in wide-escape complete heart block.","Refer for transvenous pacing."]},{"id":"tdp1","title":"Torsades de pointes","mode":"flow","flow":"tachy","story":"A 45-year-old woman on azithromycin and ondansetron has fainting spells. Runs of twisting wide QRS; QTc 560 ms between runs.","monitor":{"rhythm":"Runs of polymorphic VT; QTc 560 ms","bp":"98/60"},"rules":[{"on":"mag_tdp","n":1,"set":{"rhythm":"Sinus rhythm 76/min, QTc 540 ms, no runs"},"msg":"The runs stop after magnesium."},{"on":"amio_tachy","n":1,"set":{"rhythm":"More frequent runs of torsades"},"msg":"Amiodarone lengthened the QT: the runs come more often."}],"want":["alt:defib","drug:mag_tdp"],"wrong":["drug:amio_tachy"],"teach":["Defibrillate polymorphic VT.","Magnesium 2 g; potassium 4.5-5.0; stop QT drugs; never amiodarone."]},{"id":"pxaf1","title":"Pre-excited AF","mode":"flow","flow":"tachy","story":"A 24-year-old man with palpitations. Irregular wide tachycardia 240/min with changing QRS shapes. BP 104/66, alert.","monitor":{"rhythm":"Irregular wide tachycardia 240/min, changing QRS","bp":"104/66"},"rules":[{"on":"adenosine|verapamil|diltiazem|metoprolol_iv|esmolol|digoxin_iv|amio_tachy","n":1,"set":{"rhythm":"VF: NO PULSE","bp":"0"},"msg":"An AV-node blocker in pre-excited AF: the rhythm turned into VF!"},{"on":"procainamide|ibutilide|flecainide_iv|sync_cv","n":1,"set":{"rhythm":"Sinus rhythm 90/min with a delta wave","bp":"118/72"},"msg":"Converted to sinus rhythm (WPW pattern)."}],"want":["any:drug:procainamide|drug:ibutilide|drug:flecainide_iv|alt:sync_cv"],"wrong":["drug:adenosine","drug:verapamil","drug:diltiazem","drug:metoprolol_iv","drug:esmolol","drug:digoxin_iv","drug:amio_tachy"],"teach":["Never AV-node blockers or IV amiodarone in pre-excited AF.","Procainamide / ibutilide, or synchronised cardioversion."]},{"id":"stemi_cx","title":"STEMI with a contraindication to thrombolysis","mode":"flow","flow":"acs","story":"A 60-year-old man, anterior STEMI, pain for 2 hours. NICVD can take him but the drive is about 3 hours today. He had an ischaemic stroke 2 months ago.","monitor":{"rhythm":"Sinus rhythm 96/min; ST elevation V1-V5","bp":"142/88"},"want":["ans:c_ecg=ST elevation in 2 neighbouring leads (STEMI) or a STEMI equivalent","drug:aspirin","chk:isch","end:s_xfer"],"wrong":["drug:tenecteplase","drug:alteplase_mi","drug:reteplase","drug:streptokinase"],"teach":["Ischaemic stroke within 6 months is an absolute contraindication (ESC).","Transfer for PCI even if delayed."]},{"id":"apo1","title":"Acute pulmonary oedema with very high BP","mode":"flow","flow":"hf","story":"A 70-year-old woman, sudden breathlessness at night, frothy sputum. BP 196/112, SpO2 84%, crackles to mid-zones.","monitor":{"rhythm":"Sinus tachycardia 118/min","bp":"196/112","spo2":"84%"},"rules":[{"on":"gtn_iv|gtn_sl","n":1,"set":{"bp":"158/94","spo2":"90%"},"msg":"BP falls and breathing eases."},{"on":"furosemide","n":1,"set":{"spo2":"94%","rhythm":"Sinus rhythm 98/min"},"msg":"Good urine output."}],"want":["ans:h_bp=Over 180 (hypertensive pulmonary oedema)","any:drug:gtn_iv|drug:gtn_sl","drug:furosemide"],"teach":["Sit up, oxygen / CPAP, nitrate to SBP below 140, loop diuretic."]},{"id":"aorta1","title":"Very high BP with aortic dissection red flags","mode":"flow","flow":"bp","story":"A 52-year-old man with sudden tearing pain to the back. BP right arm 210/120, left arm 168/96.","monitor":{"rhythm":"Sinus rhythm 104/min","bp":"210/120 (right), 168/96 (left)"},"rules":[{"on":"esmolol|labetalol|metoprolol_iv","n":1,"set":{"rhythm":"Sinus rhythm 64/min","bp":"150/90"},"msg":"Heart rate controlled; BP falling."}],"want":["chk:d1","any:drug:esmolol|drug:labetalol|drug:metoprolol_iv"],"wrong":["drug:aspirin","drug:tenecteplase","drug:ufh_nste"],"teach":["Beta-blocker first, then vasodilator; HR under 60, SBP under 120; no antiplatelet or anticoagulant."]}],"debrief":{"src":["AHA25-ALS|Adult Cardiac Arrest Algorithm 2025","ERC25-ALS|ALS: minimise pauses (under 10 s); defibrillate rapidly","RCUK25|In hospital: defibrillate within 3 minutes"],"rules":["First shock within 3 minutes of a shockable rhythm (RCUK / ERC 2025).","Rhythm checks every 2 minutes (AHA / ERC).","Pauses for rhythm or pulse checks under 10 seconds.","Epinephrine: as soon as possible in asystole / PEA; after the 2nd shock in VF / pVT (AHA; ERC: 3rd); every 3-5 minutes.","Antiarrhythmic after the 3rd shock in VF / pVT.","Change the compressor every 2 minutes.","Hs and Ts considered."]}},"intendedLoops":["tachy:t_qrs>dx:d_rate"],"home":["arrest","dx","tachy","brady","acs","hf","bp","rosc"]};</script>

<script>/* CEC Code Assistant - FLOW ENGINE. Pure logic (no screen): walks the protocol pack one step at a time.
   A session S = { flow, step, flags, pt, ev[], hist[], ch{} }. The screen asks Engine for the current view and calls the actions. */
var Engine = (function () {
  function now() { return Date.now() + (typeof window !== 'undefined' && window.__ccaOffset ? window.__ccaOffset : 0); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function key(S) { return S.flow + ':' + S.step; }
  function split(S, t) { return t.indexOf(':') > 0 ? t.split(':') : [S.flow, t]; }
  function stepOf(P, f, s) { var F = P.flows[f]; return F && F.steps[s] ? F.steps[s] : null; }
  function cur(P, S) { return stepOf(P, S.flow, S.step); }
  function cond(S, c) {
    var neg = c.charAt(0) === '!'; c = neg ? c.slice(1) : c;
    var v = c.split('|').some(function (x) { return !!S.flags[x]; });
    return neg ? !v : v;
  }
  function log(S, o) { o.t = now(); o.at = key(S); S.ev.push(o); return o; }
  function snap(S) { return { flow: S.flow, step: S.step, flags: clone(S.flags), pt: clone(S.pt), ch: clone(S.ch), n: S.ev.length, wait: S.wait || null }; }
  function start(P, flowId, opt) {
    opt = opt || {};
    var F = P.flows[flowId];
    if (!F) throw new Error('No flow ' + flowId);
    var S = { flow: flowId, step: opt.step || F.start, flags: opt.flags ? clone(opt.flags) : {}, pt: opt.pt ? clone(opt.pt) : {}, ev: [], hist: [], ch: {}, t0: now(), startFlow: flowId, pack: P.version };
    log(S, { k: 'start', v: F.title });
    auto(P, S);
    return S;
  }
  /* automatic steps (if) are passed through at once */
  function auto(P, S) {
    for (var guard = 0; guard < 50; guard++) {
      var s = cur(P, S);
      if (!s) throw new Error('Unknown step ' + key(S));
      if (s.type !== 'if') return;
      var to = cond(S, s.cond) ? s.yes : s.no, p = split(S, to);
      S.flow = p[0]; S.step = p[1];
    }
    throw new Error('Too many automatic steps');
  }
  /* every action keeps the state from BEFORE it (pre), so Back undoes exactly one action: answers, flags, doses, Not available */
  function go(P, S, to, pre) {
    S.hist.push(pre || snap(S));
    var p = split(S, to);
    S.flow = p[0]; S.step = p[1]; S.wait = null;
    auto(P, S);
    var s = cur(P, S);
    if (s.type === 'end') log(S, { k: 'end', v: s.outcome });
    return S;
  }
  function back(P, S) {
    if (!S.hist.length) return false;
    var h = S.hist.pop();
    S.flow = h.flow; S.step = h.step; S.flags = h.flags; S.pt = h.pt; S.ch = h.ch; S.wait = h.wait;
    log(S, { k: 'back' });
    return true;
  }
  function setFlags(S, list) { (list || []).forEach(function (f) { S.flags[f] = true; }); }
  function answer(P, S, i) {
    var s = cur(P, S), a = s.ans[i], pre = snap(S);
    log(S, { k: 'ans', v: a[0], i: i });
    if (a[2] && a[2].set) setFlags(S, a[2].set);
    return go(P, S, a[1], pre);
  }
  function ptSubmit(P, S, vals) {
    var s = cur(P, S), pre = snap(S);
    s.ask.forEach(function (f) {
      var d = P.ptFields[f], v = vals[f];
      if (d.kind === 'yesno') { S.pt[f] = v === true ? 'yes' : v === false ? 'no' : ''; S.flags[f] = v === true; }
      else if (d.kind === 'flag') { S.pt[f] = !!v; S.flags[f] = !!v; }
      else if (d.kind === 'num') {
        var n = v === '' || v == null ? null : +v;
        S.pt[f] = n != null && isFinite(n) ? n : null;
        if (d.sets) Object.keys(d.sets).forEach(function (fl) { var m = /^>=(\d+)$/.exec(d.sets[fl]); S.flags[fl] = !!(m && S.pt[f] != null && S.pt[f] >= +m[1]); });
      }
    });
    log(S, { k: 'pt', v: ptText(P, S) });
    return go(P, S, s.next, pre);
  }
  function ptText(P, S) {
    var a = [];
    if (S.pt.preg === 'yes') a.push('pregnant / recently delivered');
    if (S.pt.age != null) a.push('age ' + S.pt.age);
