<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEC Code Assistant</title>
<meta name="description" content="Emergency decision and code-leading assistant of the Cardiac Emergency Centre, Sindh Government Hospital Liaquatabad, Karachi">
<meta name="theme-color" content="#7A0E1E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>/* CEC Code Assistant - maroon red with a dark golden strip. Light animations only (CSS / SVG), so cheap phones stay smooth. */
:root{--m:#7A0E1E;--md:#4E0712;--g:#B8860B;--gl:#D4AF37;--bg:#FBF7F2;--card:#FFFFFF;--ink:#1D1416;--mute:#6B5A5D;--line:#E6D9CC;--soft:#F5ECE2;--ok:#1E7A3C;--warn:#B3261E;--amber:#B26A00;--btn:#F3E9DE}
html.dark{--bg:#160A0D;--card:#241216;--ink:#F6EDE6;--mute:#C9B3B0;--line:#3E2329;--soft:#2E171C;--btn:#341A20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:contain}
h1,h2,h3{margin:0 0 8px;line-height:1.2}h2{font-size:21px}h3{font-size:17px;color:var(--m)}html.dark h3{color:var(--gl)}
p{margin:6px 0}.small{font-size:14px;color:var(--mute)}.help{font-size:15px;color:var(--mute)}
.hidden{display:none!important}
/* ---- top bar with the golden strip */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;background:var(--md);background:linear-gradient(180deg,var(--m),var(--md));color:#fff;min-height:58px;padding:0 6px}
.goldstrip{height:5px;background:linear-gradient(90deg,var(--g),var(--gl) 50%,var(--g));position:sticky;top:58px;z-index:5}
.bt{flex:1;font-weight:700;font-size:18px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bs{font-size:13px;opacity:.85}
.ib{width:48px;height:48px;border:0;background:transparent;color:#fff;font-size:24px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center}.ib:active{background:rgba(255,255,255,.15)}
.homebar{min-height:64px}.homebar+.goldstrip{top:64px}.hb1{flex:1;display:flex;align-items:center;gap:10px;padding-left:4px}
.net{width:11px;height:11px;border-radius:50%;margin:0 4px;flex:none}.net.on{background:#4ADE80;box-shadow:0 0 0 2px rgba(74,222,128,.25)}.net.off{background:#F59E0B;box-shadow:0 0 0 2px rgba(245,158,11,.25)}
.prb{display:inline-block;margin-left:8px;background:var(--gl);color:var(--md);font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;vertical-align:middle;letter-spacing:.5px}
/* ---- layout */
.pad{padding:12px 12px 40px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(78,7,18,.06);border-top:3px solid var(--g)}
.scr{animation:none}.scr.fwd{animation:inr .18s ease-out}.scr.back{animation:inl .18s ease-out}
@keyframes inr{from{opacity:.4;transform:translateX(14px)}to{opacity:1;transform:none}}@keyframes inl{from{opacity:.4;transform:translateX(-14px)}to{opacity:1;transform:none}}
/* ---- buttons: big, glove-friendly (48 px and more) */
.btn{display:block;width:100%;min-height:52px;margin:8px 0 0;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--btn);color:var(--ink);font:inherit;font-weight:650;text-align:left;cursor:pointer}
.btn:active{transform:scale(.985)}.btn:disabled{opacity:.6}
.btn.pri{background:var(--m);border-color:var(--md);color:#fff;text-align:center}.btn.red{background:#A3111F;border-color:#7a0b16;color:#fff;text-align:center}
.btn.gold{background:var(--gl);border-color:var(--g);color:#3a2600;text-align:center}.btn.ghost{background:transparent;text-align:center;color:var(--m)}html.dark .btn.ghost{color:var(--gl)}
.btn.big{min-height:60px;font-size:19px}.btn.huge{min-height:92px;font-size:26px;letter-spacing:1px}.btn.sm{display:inline-block;width:auto;min-height:40px;margin:0 0 0 8px;padding:6px 12px}
.btn.opt{font-size:18px;border-left:6px solid var(--g);background:var(--card)}.btn.opt.good{border-left-color:var(--ok)}
.btn.na{background:transparent;border-style:dashed;text-align:center;color:var(--warn);font-weight:700}
.btn.wa{background:#1F8F4E;border-color:#156b39;color:#fff;text-align:center}
.btnrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.btnrow .btn{text-align:center;padding:10px 6px;font-size:15px}
.seg{display:flex;gap:6px}.seg .btn{margin-top:4px;text-align:center}.segb.on{background:var(--m);color:#fff;border-color:var(--md)}
.tabs{margin-bottom:10px}.tabs .btn{font-size:14px;min-height:46px;padding:6px}
/* ---- inputs */
.lb{display:block;margin:12px 0 4px;font-weight:650;font-size:15px}.in{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--card);color:var(--ink)}
.in:focus{outline:3px solid rgba(212,175,55,.45);border-color:var(--g)}.in.num{max-width:150px}textarea.in{min-height:84px}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:15px}.chk input{width:22px;height:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* ---- splash: monogram, maroon / gold, a light ECG line */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px;background:radial-gradient(circle at 50% 35%,#94162A 0%,var(--m) 38%,var(--md) 100%);border-bottom:8px solid var(--g)}
.splash h1{font-size:30px;margin:18px 0 4px;letter-spacing:.5px}.splash .sub{color:#F2DDB0;margin:0 0 14px}.splash .ver{font-size:13px;opacity:.8;margin-top:16px}
.mono{display:inline-block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.ecg{display:block;width:100%;height:40px}.ecg path{fill:none;stroke:var(--gl);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:ecg 2.4s linear infinite}
.ecg.big{max-width:360px;height:64px}.ecg.thin{height:22px;background:var(--md)}.ecg.thin path{stroke-width:1.6;opacity:.85}
@keyframes ecg{0%{stroke-dashoffset:420}70%{stroke-dashoffset:0}100%{stroke-dashoffset:-30;opacity:.2}}
/* ---- home */
.codebtn{position:relative;display:block;width:100%;border:0;border-radius:20px;padding:18px 18px 12px;margin:4px 0 14px;text-align:left;color:#fff;background:linear-gradient(135deg,#B3141F,var(--m) 55%,var(--md));box-shadow:0 6px 16px rgba(122,14,30,.35);border-bottom:6px solid var(--g);overflow:hidden}
.codebtn .cb1{display:block;font-size:26px;font-weight:850;letter-spacing:1px}.codebtn .cb2{display:block;font-size:15px;opacity:.92}.codebtn .cbecg{height:30px;margin-top:6px}.codebtn .cbecg path{stroke:#FFE7A8}
.runbar{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin:0 0 10px;background:#A3111F;color:#fff;font:inherit;font-size:17px;text-align:center;animation:pulsebg 1.6s ease-in-out infinite}.runbar.gold{background:var(--gl);color:#3a2600;animation:none}
@keyframes pulsebg{50%{background:#7A0E1E}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.tiles.one{grid-template-columns:1fr}.tiles.small3{grid-template-columns:1fr 1fr 1fr}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:112px;padding:12px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:inherit;text-align:left;border-top:4px solid var(--g)}
.tile:active{transform:scale(.98)}.tile .ti{font-size:24px;color:var(--m)}.tile .tt{font-weight:750;font-size:16px;line-height:1.2}.tile .ts{font-size:12.5px;color:var(--mute);line-height:1.25}
.tile.t2{min-height:84px;align-items:center;justify-content:center;text-align:center}.tile.wide{min-height:auto}.tile .tag{margin-top:4px;font-size:12px;background:var(--soft);border-radius:6px;padding:2px 6px;color:var(--m)}
.badge{position:absolute;top:8px;right:8px;background:#A3111F;color:#fff;border-radius:999px;font-size:13px;font-weight:800;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.foot{text-align:center;font-size:12.5px;color:var(--mute);margin-top:16px}
.lgh{display:flex;gap:12px;align-items:center}.emerg{border-top-color:#A3111F}
/* ---- flow steps */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0;max-width:720px;margin:0 auto}.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--m);font-weight:650}
.qt{font-size:21px;line-height:1.3}.ans{margin-top:6px}
.warnb{background:#FDECEA;border:1.5px solid #E8A39C;color:#8C1A12;border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:700}.warnb.caution{background:#FFF4DC;border-color:#E9C46A;color:#6B4600}
html.dark .warnb{background:#3a1512;color:#FFC9C2;border-color:#7a2a22}html.dark .warnb.caution{background:#33260c;color:#FFE1A1;border-color:#7a5a12}
.okb{background:#E8F5EC;border:1px solid #A9D8B8;color:#14532D;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:15px}html.dark .okb{background:#112a1a;color:#BDEBC9;border-color:#2a5a3a}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}.note.gold{border-left:5px solid var(--g)}
.dx .dxn{font-size:25px;color:var(--m)}html.dark .dx .dxn{color:var(--gl)}.dxl{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--g)}
.steptext{font-weight:700;font-size:18px;margin-bottom:6px}.optn{font-size:12.5px;color:var(--mute);margin:2px 0 4px}
.skipped{background:#FFF4DC;border:1px dashed #E9C46A;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px;color:#6B4600}html.dark .skipped{background:#33260c;color:#FFE1A1}
.dcard{border:2px solid var(--m);border-radius:16px;padding:12px;margin:8px 0 4px;background:linear-gradient(180deg,var(--card),var(--soft))}.dcard.alt{border-color:var(--g)}
.dcard .dk{font-size:11.5px;font-weight:800;letter-spacing:1px;color:var(--g);text-transform:uppercase}.dcard .dn{font-size:23px;color:var(--m);margin:2px 0 8px}html.dark .dcard .dn{color:var(--gl)}
table.dose{width:100%;border-collapse:collapse;margin:4px 0}table.dose th,table.dose td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
table.dose th{font-size:14px;color:var(--mute);font-weight:650;width:40%}table.dose td{font-size:19px;font-weight:800}table.dose tr.cur td,table.dose tr.cur th{background:rgba(212,175,55,.18)}
.calc{background:#E9F1FB;border-radius:10px;padding:8px 10px;margin:6px 0;font-weight:700;color:#0E3A66}html.dark .calc{background:#132538;color:#BFDBFE}
.dtext{font-size:17px}.given{font-weight:700}
details.more{margin-top:8px}details summary{cursor:pointer;font-weight:650;color:var(--m);min-height:40px;display:flex;align-items:center}html.dark details summary{color:var(--gl)}
table.dt{width:100%;border-collapse:collapse;font-size:15px}table.dt th{width:30%;text-align:left;color:var(--mute);vertical-align:top;padding:5px 6px 5px 0;font-weight:650}table.dt td{padding:5px 0;border-bottom:1px solid var(--line)}
.srcs{margin-top:10px;font-size:13.5px}.srcs summary{font-size:13.5px;color:var(--mute)}.srcl{background:var(--soft);border-radius:8px;padding:6px 8px;margin:4px 0}.srcl span{color:var(--mute);font-size:12.5px}
.ptq{margin:10px 0}.ptq.inl{display:flex;align-items:center;justify-content:space-between;gap:10px}.ptl{font-weight:650}
.ptf{display:flex;gap:10px;align-items:flex-start;padding:12px 10px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;font-size:16px}.ptf input{width:26px;height:26px;flex:none;accent-color:var(--m)}.ptf.big{font-size:18px}
.cks{margin:6px 0}.ck{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0}.ck input{width:26px;height:26px;flex:none;accent-color:var(--m)}
.ck small{display:block;color:var(--mute);font-size:13px;font-weight:400}.ck.on{border-color:var(--m);background:rgba(122,14,30,.06)}
.monitor{max-width:720px;margin:8px auto 0;background:#07130C;color:#5BFF8F;border-radius:12px;padding:8px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;border:2px solid #23412F}
.monitor .mlab{font-size:11px;color:#8BB89A;letter-spacing:1px}.monitor .mr{font-size:18px;font-weight:700}.monitor .mv{font-size:15px;color:#BFF5CF}.monitor .mmsg{margin-top:4px;color:#FFE08A;font-size:14px}.monitor.sm{margin:8px 12px 0}
.story{border-top-color:var(--m)}
/* ---- CODE MODE: the most readable screen, even in a bright room */
body.codeview{background:#FFFFFF}html.dark body.codeview{background:#0E0608}
.cbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;background:linear-gradient(180deg,var(--m),var(--md));color:#fff;padding:4px 6px;min-height:76px}
.cbar+.goldstrip{top:76px}.clk{flex:1;text-align:center}.clkl{font-size:12px;letter-spacing:1.5px;opacity:.85}.clkv{font-size:46px;font-weight:850;font-variant-numeric:tabular-nums;line-height:1}
.beat{animation:beat 1s ease-in-out infinite}@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(.99)}36%{transform:scale(1.03)}}
.cpad{padding:10px 10px 50px;max-width:720px;margin:0 auto}
.crow{display:flex;gap:10px;align-items:stretch}.ring{position:relative;width:128px;height:128px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rbg{fill:none;stroke:#EEE2D5;stroke-width:9}.rfg{fill:none;stroke:var(--m);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .25s linear}html.dark .rbg{stroke:#3a2228}
.rtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rtxt div{font-size:30px;font-weight:850;font-variant-numeric:tabular-nums}.rtxt small{font-size:12px;color:var(--mute);font-weight:700}
.ring.due .rfg{stroke:#D10F1F}.ring.due{animation:flash 1s steps(2) infinite}.ring.paused .rtxt div{color:var(--amber)}.ring.over .rtxt div{color:#D10F1F}
@keyframes flash{50%{opacity:.45}}
.prompts{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.pr{border-radius:12px;padding:8px 10px;font-weight:750;font-size:15.5px;line-height:1.25;background:#F1F5F0;color:#1A3D22}
.pr.due{background:#FFF1C9;color:#5A3A00;border:2px solid #E7B416}.pr.over{background:#D10F1F;color:#fff;animation:flash 1s steps(2) infinite}.pr.info{background:#EEF2FF;color:#1E2A78}.pr.ok{background:#E7F6EC;color:#14532D}
html.dark .pr{background:#16261b;color:#c9f2d4}html.dark .pr.due{background:#3a2c08;color:#ffe9a8}html.dark .pr.info{background:#171d3c;color:#c7d2fe}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.counts div{background:var(--soft);border-radius:12px;text-align:center;padding:6px 2px;border-bottom:3px solid var(--g)}
.counts b{display:block;font-size:30px;line-height:1.1;color:var(--m)}html.dark .counts b{color:var(--gl)}.counts span{font-size:11.5px;color:var(--mute);font-weight:700}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cgrid .wide{grid-column:1/-1}
.cbtn{min-height:64px;border:2px solid #CDB9A8;border-radius:16px;background:#FFFFFF;color:#1D1416;font:inherit;font-weight:800;font-size:16.5px;padding:8px;line-height:1.15}
html.dark .cbtn:not(.go):not(.pause):not(.shock):not(.epi):not(.rosc):not(.end):not(.amber){background:#241216;color:#F6EDE6;border-color:#4a2a31}
html.dark .cbtn.end{background:#000;border-color:#D4AF37}
.cbtn:active{transform:scale(.97);filter:brightness(.92)}.cbtn.s3{min-height:56px;font-size:15px}
.cgrid .s3{grid-column:span 1}.cgrid{grid-template-columns:repeat(6,1fr)}.cgrid>.cbtn{grid-column:span 3}.cgrid>.cbtn.s3{grid-column:span 2}.cgrid>.cbtn.wide{grid-column:1/-1}
.cbtn.go{background:#1E7A3C;border-color:#14532D;color:#fff;min-height:74px;font-size:21px}.cbtn.pause{background:#FFF1C9;border-color:#E7B416;color:#5A3A00;min-height:74px;font-size:19px}
.cbtn.shock{background:#FFDDE0;border-color:#D10F1F;color:#7A0E1E}.cbtn.epi{background:var(--m);border-color:var(--md);color:#fff}.cbtn.rosc{background:#DFF3E5;border-color:#1E7A3C;color:#14532D}
.cbtn.end{background:#1D1416;border-color:#000;color:#fff;margin-top:4px}.cbtn.amber{background:var(--gl);border-color:var(--g);color:#3a2600}
.tl{margin-top:12px;background:var(--soft);border-radius:12px;padding:8px 10px}.tlh{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--g)}.tl ul{margin:4px 0 0;padding:0;list-style:none;font-size:14.5px}.tl li{padding:2px 0}.tl .tm{display:inline-block;min-width:46px;font-variant-numeric:tabular-nums;font-weight:800;color:var(--m)}
.cprl{margin:0;padding-left:18px}.cprl li{margin:4px 0}
/* ---- records */
.ritem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;margin:0 0 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}
.rk{font-size:11px;font-weight:800;letter-spacing:.5px;background:var(--m);color:#fff;border-radius:6px;padding:3px 6px;flex:none}.rk.pr{background:var(--gl);color:#3a2600}
.rt{flex:1;min-width:0}.rt b{display:block}.rt small{color:var(--mute)}.rs{font-size:12.5px;font-weight:800;border-radius:6px;padding:2px 6px}.rs.ok{color:var(--ok)}.rs.wait{color:var(--amber)}
.sync{font-weight:700;color:var(--amber)}.sync.ok{color:var(--ok)}
table.tlt{width:100%;border-collapse:collapse;font-size:14.5px}table.tlt td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}table.tlt td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mute);width:72px}table.tlt tr.und{opacity:.5;text-decoration:line-through}
.db{border-radius:10px;padding:8px 10px;margin:6px 0;font-weight:650}.db.ok{background:#E7F6EC;color:#14532D}.db.bad{background:#FDECEA;color:#8C1A12}html.dark .db.ok{background:#16261b;color:#c9f2d4}html.dark .db.bad{background:#3a1512;color:#FFC9C2}
.src1 p{margin:2px 0}
/* ---- modal, toast */
#modal{position:fixed;inset:0;z-index:50;background:rgba(20,6,9,.55);display:flex;align-items:flex-end;justify-content:center;padding:10px}
.mbox{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 16px 16px;padding:16px;border-top:6px solid var(--g);animation:up .16s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.mt{font-size:20px;font-weight:800;color:var(--m);margin-bottom:6px}html.dark .mt{color:var(--gl)}.mbtns .btn{text-align:center}
.mbox.grid .mbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.mbox.grid .mbtns .btn{margin:0;min-height:64px;font-size:19px}.mbox.grid .mbtns .btn:last-child{grid-column:1/-1}
.mbox.list .mbtns .btn{text-align:left}.mbox.tall{max-height:96vh}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(40px);opacity:0;z-index:60;background:var(--md);color:#fff;border-radius:14px;padding:12px 16px;max-width:92vw;font-weight:650;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:.2s;border-bottom:3px solid var(--g);pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app"></div>

75 mg/kg)"],"check":"LABEL (AHA-based dosing): 1-1.5 mg/kg, then 0.5-0.75 mg/kg every 5-10 min, total 3 mg/kg (agrees).","name":"Lidocaine in cardiac arrest (if amiodarone is not available)","act":"Given"},"calcium_cl":{"group":"Electrolyte","doses":[["Dose","10 mL of 10% (1 g)"]],"route":"IV, through a large vein (it burns if it leaks)","how":"In cardiac arrest: rapid IV bolus. With a pulse: over 5 minutes. Flush before and after, and do not give it in the same line as sodium bicarbonate (it precipitates).","max":"May repeat once if the ECG still shows hyperkalaemia.","watch":"Leak into the tissues (necrosis); slow heart rate.","contra":"Digoxin toxicity (use only on expert advice).","preg":{"use":"ok","text":"Give it: in a pregnant woman who arrests while on IV magnesium sulfate, calcium is reasonable.","src":["AHA25-SPEC|§19.3 Rec 8"]},"src":["RCUK25-SPEC|Hyperkalaemia: 10 mL 10% calcium chloride IV (with 50 mmol sodium bicarbonate in hyperkalaemic arrest)","AHA25-SPEC|§15: IV calcium for hyperkalaemic arrest, class 2b"],"check":"LABEL (calcium chloride): 200-1000 mg (2-10 mL of 10%) slow IV for low calcium; the hyperkalaemia dose is from RCUK 2025. Second check of the hyperkalaemia dose: pending (BNF).","diff":"AHA 2025 says the benefit of calcium in hyperkalaemic arrest is not well established (2b); RCUK 2025 recommends it.","name":"Calcium chloride 10% (hyperkalaemia, low calcium, magnesium overdose, calcium-channel blocker overdose)","act":"Given"},"calcium_gluc":{"group":"Electrolyte","doses":[["Dose","30 mL of 10%"]],"route":"IV","how":"Over 10 minutes with a pulse; as a bolus in cardiac arrest.","watch":"Slow heart rate; leak into tissues.","contra":"Digoxin toxicity (expert advice).","preg":{"use":"ok","text":"Used in pregnancy (it is the antidote for magnesium toxicity: 30 mL 10% IV).","src":["ESC25-PREG|§12.3.3.2 magnesium toxicity"]},"src":["RCUK25-SPEC|Hyperkalaemia: if calcium chloride is not available, 30 mL 10% calcium gluconate over 10 min"],"chec -HF|Opioids not routinely used in decompensated HF"],"check":"Second check: pending (BNF).","name":"Morphine (severe pain or distress)","act":"Given"},"furosemide":{"group":"Loop diuretic","doses":[["Not on diuretics","40 mg IV"],["Already on a loop diuretic","IV dose = about 2 times the usual daily oral dose"],["No response in 1-2 h","double the dose"]],"route":"IV, slowly over 1-2 minutes","how":"Check urine output (aim more than 100-150 mL/hour in the first 6 hours) and, if possible, urine sodium at 2 hours.","watch":"Low potassium and sodium, low BP, kidney function.","contra":"No urine at all (anuria) without dialysis plan; severe low volume.","preg":{"use":"caution","text":"Use for pulmonary oedema in pregnancy (it may reduce placental blood flow; avoid in pre-eclampsia unless pulmonary oedema).","src":["ESC25-PREG|§12.3.3.2 (diuretics with pulmonary oedema)"]},"src":["ESC26-HF|Section 7, Figure 13: IV loop diuretic (40 mg furosemide if diuretic-naive, or double the daily oral dose in chronic users)","ESC26-HF|Urinary sodium-guided diuretic therapy (IIb)"],"check":"LABEL: acute pulmonary oedema 40 mg IV over 1-2 min, 80 mg if no response within 1 hour (agrees).","name":"Furosemide IV","act":"Given"},"norepinephrine":{"group":"Vasopressor","act":"Started","doses":[["Usual range","0.2 to 1 micrograms/kg/min (start low, e.g. 0.05-0.1)"]],"kg":[{"lab":"Rate","lo":0.2,"hi":1,"unit":"micrograms/min"}],"route":"IV infusion, central line if possible","how":"Target MAP 65 mmHg or more. Example: 4 mg in 50 mL = 80 micrograms/mL.","watch":"Ischaemia of fingers and gut; tissue damage if it leaks; arrhythmia.","contra":"Untreated low volume (give fluid if no congestion).","src":["ESC21-HF|Inotrope / vasopressor table: norepinephrine 0.2-1.0 micrograms/kg/min","AHA25-PCAC|Section 5: MAP of at least 65 mmHg after ROSC"],"check":"LABEL: start 8-12 micrograms/min, maintain 2-4 micrograms/min, titrate to low-normal BP; septic shock 0.01-3 micrograms/kg/min (consistent).","name":"Norepinephrine (noradrenaline) infusion"},"dobutamine":{"group":"Inotrope","act":"Started","doses":[["Range","2 to 20 micrograms/kg/min (start 2-3)"]],"kg":[{"lab":"Rate","lo":2,"hi":20,"unit":"micrograms/min"}],"route":"IV infusion","how":"For low output with adequate BP (it can lower BP); combine with norepinephrine if BP is low.","watch":"Tachycardia, arrhythmia, low BP, ischaemia.","contra":"Hypertrophic obstructive cardiomyopathy.","src":["ESC21-HF|Inotrope table: dobutamine 2-20 micrograms/kg/min","ESC26-HF|Section 7: inotropes in low output with hypoperfusion"],"check":"LABEL: 2-20 micrograms/kg/min maintenance, start 0.5-1, max 40 (agrees).","name":"Dobutamine infusion"},"labetalol":{"group":"Alpha and beta blocker","doses":[["1st dose","20 mg IV over 2 minutes"],["2nd dose (10 min later)","40 mg IV"],["3rd and later doses (every 10 min)","80 mg IV (300 mg in total at most)"],["Or infusion","1-2 mg/min"]],"seq":3,"times":3,"route":"IV","how":"Lying down. BP every 5 minutes. Stop at the target; then oral treatment.","max":"300 mg in total.","watch":"Low BP on standing, slow heart rate, wheeze.","contra":"Asthma or COPD with wheeze; heart block; acute heart failure; slow heart rate; cocaine / amphetamine crisis (unopposed alpha) is debated.","flags":{"asthma":["avoid","Non-selective beta-blocker: bronchospasm."],"hfref":["caution","Avoid in acute decompensated heart failure."]},"preg":{"use":"ok","text":"First-line IV drug for severe hypertension in pregnancy (20 mg, then 40, then 80 every 10 min; max 300 mg).","src":["ESC25-PREG|§12.3.3.2.3 (IV labetalol)","ACOG767|Labetalol protocol"]},"src":["ESC19-HTNEM|Labetalol first-line in several hypertensive emergencies (0.25-0.5 mg/kg; 2-4 mg/min until goal, then 5-20 mg/h)","AHAACC25-HBP|Section 6.2 hypertensive emergency drugs"],"check":"LABEL: 20 mg over 2 min, then 40-80 mg every 10 min to 300 mg; or 2 mg/min infusion (agrees).","diff":"The ESC position paper doses by weight (0.25-0.5 mg/kg) and gives an infusion of 2-4 mg/min until the goal.","name":"Labetalol IV","act":"Given"},"nicardipine":{"group":"Calcium-channel blocker (dihydropyridine)","act":"Started","doses":[["Start","5 mg/hour"],["Increase","2.5 mg/hour every 5-15 minutes"]],"route":"IV infusion","how":"At the goal, lower to about 3 mg/hour.","max":"15 mg/hour.","watch":"Low BP, headache, tachycardia.","contra":"Severe aortic stenosis.","preg":{"use":"ok","text":"An IV option in pregnancy (ESC 2025: IV labetalol or nicardipine).","src":["ESC25-PREG|§12.3.3.2"]},"src":["ESC19-HTNEM|Nicardipine 5-15 mg/h (first-line with labetalol)","AHAACC25-HBP|Section 6.2"],"check":"LABEL: start 5 mg/h, +2.5 mg/h every 5-15 min, max 15 mg/h, then 3 mg/h (agrees). Often not available in Pakistan.","name":"Nicardipine infusion"},"urapidil":{"group":"Alpha blocker","doses":[["Bolus","12.5 to 25 mg"],["Infusion","5 to 40 mg/hour"]],"route":"IV","watch":"Low BP.","contra":"Aortic stenosis.","preg":{"use":"caution","text":"ESC 2025: an option in pregnancy where available.","src":["ESC25-PREG|§12.3.3.2"]},"src":["ESC19-HTNEM|Urapidil 12.5-25 mg bolus, 5-40 mg/h"],"check":"Not in the US label (not sold there); BNF check pending.","name":"Urapidil IV","act":"Given"},"nitroprusside":{"group":"Vasodilator","act":"Started","doses":[["Range","0.3 to 10 micrograms/kg/min"],["Increase","0.5 micrograms/kg/min every 5 min"]],"route":"IV infusion, protected from light, arterial line ideally","watch":"Sudden low BP; cyanide toxicity with long use or kidney failure.","contra":"Pregnancy (last resort only: foetal cyanide).","preg":{"use":"avoid","text":"Last resort in pregnancy (cyanide risk to the baby).","src":["ESC25-PREG|§12.3.3.2"]},"src":["ESC19-HTNEM|Nitroprusside 0.3-10 micrograms/kg/min"],"check":"Second check: pending (BNF). Rarely available.","name":"Sodium nitroprusside infusion (ICU only)"},"hydralazine":{"seq":2,"group":"Vasodilator","doses":[["1st dose","5 to 10 mg IV over 2 minutes"],["Then after 20 min if needed","10 mg"]],"route":"IV","how":"Recheck BP in 20 minutes. If 20 mg in total has not worked, change to labetalol (ACOG).","max":"20 mg before changing drug (ACOG).","watch":"Low BP, fast heart rate, headache; foetal heart rate changes.","contra":"Tachycardia, ischaemia.","preg":{"use":"caution","text":"ESC 2025: second-line (less effective, more side effects than labetalol or nifedipine).","src":["ESC25-PREG|§12.3.3"]},"src":["ACOG767|Hydralazine 5-10 mg IV over 2 min, repeat in 20 min","ESC25-PREG|§12.3.3 (hydralazine second-line)"],"check":"LABEL: 20-40 mg IM or IV for severe hypertension outside pregnancy; the small pregnancy doses are from ACOG.","name":"Hydralazine IV (pregnancy, second-line)","act":"Given"},"nifedipine_po":{"seq":2,"group":"Calcium-channel blocker","doses":[["Dose","10 mg by mouth (swallowed)"],["Repeat after 20-30 min if still 160/110 or more","10-20 mg"]],"route":"By mouth: swallow; never bite a capsule or put it under the tongue","how":"Continuous foetal monitoring if viable. Outside pregnancy, do not use short-acting nifedipine for high BP (sudden falls, stroke).","watch":"Headache, flushing, fast fall in BP (especially with magnesium).","contra":"Outside pregnancy: not for hypertensive emergency.","preg":{"use":"ok","text":"ESC 2025: oral nifedipine, labetalol or methyldopa for severe hypertension; nifedipine was better in some studies.","src":["ESC25-PREG|§12.3.3, Figure 12C (nifedipine 5-10 mg; 10 mg if > 160/110)"]},"src":["ESC25-PREG|§12.3.3 and Figure 12C","ACOG767|Immediate-release nifedipine 10 mg, then 20 mg"],"check":"Two sources: ESC 2025 (10 mg) and ACOG (10 mg, then 20 mg).","name":"Nifedipine by mouth (pregnancy)","act":"Given"},"mgso4_eclampsia":{"group":"Anticonvulsant","doses":[["Loading","4 g IV slowly (label: 4 g diluted to 10-20% over 3-4 minutes, or 4-5 g in 250 mL)"],["Then","1 g/hour IV infusion (label: 1-2 g/hour)"]],"route":"IV (or IM regimen)","how":"Before each dose and every hour: knee reflexes present, breathing 16 per minute or more, urine at least 100 mL in 4 hours (label). Toxicity: stop it and give calcium gluconate 10% 30 mL IV (ESC 2025).","max":"Kidney failure: lower infusion and check levels.","watch":"Loss of reflexes, slow breathing, low BP.","contra":"Myasthenia gravis.","flags":{"ckd":["caution","Builds up in kidney failure: lower infusion, check levels."]},"preg":{"use":"ok","text":"The drug for pre-eclampsia with severe features (to prevent fits), alongside delivery planning.","src":["ESC25-PREG|§12.3.3.2"]},"src":["ESC25-PREG|§12.3.3.2 magnesium sulfate for pre-eclampsia with severe features; toxicity: calcium gluconate 30 mL"],"check":"LABEL: loading 4-5 g IV, maintenance 1-2 g/h, up to 30-40 g/day; calcium salt ready (agrees).","name":"Magnesium sulfate (severe pre-eclampsia / eclampsia)","act":"Given"}},"alts":{"vagal":{"name":"Vagal manoeuvre (modified Valsalva)","text":"Patient semi-sitting blows into a 10 mL syringe (or hard against closed lips) for 15 seconds, then is laid flat at once with the legs lifted to 45 degrees for 15 seconds. Run a rhythm strip. Carotid massage only if no bruit and no stroke history. Never press on the eyes.","src":["ESC19-SVT|Vagal manoeuvres first (modified Valsalva)","RCUK25|Tachyarrhythmia algorithm: vagal manoeuvres","ESC25-PREG|§12.4.1.1 (vagal manoeuvres in pregnancy)"]},"sync_cv":{"name":"Synchronised cardioversion","text":"Sedate whenever possible (the doctor who sedates manages the airway). Pads front-and-side or front-and-back. Press SYNC and check the markers on each QRS; re-press SYNC after each shock. Energy (AHA 2025 electrical cardioversion algorithm, biphasic): AF 200 J; flutter 200 J; regular narrow tachycardia 100 J; monomorphic VT 100 J; increase if it fails (up to 3 attempts, RCUK). Follow your defibrillator's guide; if unknown, use the maximum. Polymorphic VT: NOT synchronised: defibrillate. In pregnancy: safe at every stage, same energy; monitor the baby afterwards.","src":["AHA25-ALS|Electrical Cardioversion Algorithm 2025 and Section 18.1 (200 J for AF / flutter)","RCUK25|Synchronised shock up to 3 attempts","ESC25-PREG|§12.4.2 (cardioversion safe in all trimesters)"]},"defib":{"name":"Unsynchronised shock (defibrillation)","text":"For polymorphic VT (always unstable) and pulseless rhythms: defibrillate at once with the device's defibrillation dose (biphasic 120-200 J as the maker advises, or the maximum; monophasic 360 J). If the pulse is lost, start CPR and use Code mode.","src":["AHA25-ALS|Top message 8: polymorphic VT needs immediate defibrillation; Cardiac arrest algorithm shock energy"]},"tcp":{"name":"Transcutaneous pacing","text":"Pads front and back. Demand mode, rate 60-70/min; raise the current until every spike is followed by a wide QRS (electrical capture), then check a pulse for mechanical capture; set 5-10 mA above the threshold. Give pain relief and sedation. Arrange transvenous pacing (refer to NICVD).","src":["AHA25-ALS|Bradycardia algorithm 2025: transcutaneous pacing if atropine fails; consider transvenous pacing","RCUK25|Adult bradyarrhythmia 2025: transcutaneous pacing; seek expert help"]},"nondrug_rate":{"name":"No drug available: synchronised cardioversion or referral","text":"If the patient becomes unstable: synchronised cardioversion. If stable: keep monitored, treat the cause (fever, low volume, low oxygen, thyroid, pain) and refer to the cardiologist / NICVD.","src":["AHA25-ALS|Tachyarrhythmia algorithm: if refractory, expert consultation","RCUK25|Seek expert help"]},"nondrug_apo":{"name":"Without drugs","text":"Sit the patient upright with legs down. Oxygen if SpO2 below 90%; CPAP / non-invasive ventilation if breathless (RR over 25) and SpO2 below 90%. Urgent referral to a CCU (NICVD).","src":["ESC26-HF|Section 7, Figure 13: oxygen, non-invasive ventilation, early transfer"]},"pressor_none":{"name":"No vasopressor available","text":"Lay flat with legs raised, fluid bolus 200-250 mL over 15-30 minutes if no congestion, treat the cause (STEMI: urgent PCI), and transfer to NICVD at once with a doctor.","src":["ESC26-HF|Cardiogenic shock: early transfer to a centre with a Shock Team"]},"bp_none":{"name":"No IV antihypertensive available","text":"Treat the cause and the organ damage, keep the patient lying down and calm, avoid fast falls (never sublingual nifedipine capsules outside pregnancy), and transfer to an ICU with titratable IV drugs (NICVD for aortic dissection, a stroke centre for stroke).","src":["AHAACC25-HBP|Section 6.2: ICU admission for hypertensive emergency","ESC24-HTN|Hypertensive emergencies: titratable IV drugs in a monitored setting"]},"tdp_care":{"name":"Torsades: correct the causes","text":"Potassium to 4.5-5.0 mmol/L, magnesium normal, stop every QT-lengthening drug, treat slow heart rate. Defibrillate any sustained run. Do not give amiodarone.","src":["ESC22-VA|Torsades: correct electrolytes, withdraw offending drugs","RCUK25|Torsades: avoid amiodarone"]},"dialysis":{"name":"Dialysis / referral","text":"Severe hyperkalaemia that does not settle: urgent dialysis. Arrange transfer while continuing treatment.","src":["RCUK25-SPEC|Consider dialysis for refractory severe hyperkalaemia"]},"refer_nicvd":{"name":"Refer to NICVD Karachi","text":"Call NICVD (emergency / cath lab) and the ambulance. Send the ECGs, this record and the drugs given (with times). Transfer with a doctor, monitor, defibrillator and oxygen.","src":["ESC23-ACS|Transfer to a PCI-capable centre","ACCAHA25-ACS|Systems of care: transfer for PCI"]},"refer_expert":{"name":"Call the senior / cardiologist and refer","text":"Get expert help now: the CEC senior / cardiologist on call; transfer to NICVD if the rhythm or condition does not settle.","src":["AHA25-ALS|Expert consultation","RCUK25|Seek expert help"]},"refer_obs":{"name":"Obstetric emergency referral","text":"Call the obstetrician now and transfer to a hospital with obstetric and neonatal cover, with the drugs given written down. Continuous foetal monitoring.","src":["ESC25-PREG|Pregnancy Heart Team; §12.3.3 severe hypertension: admission"]}},"checklists":{"hst":{"title":"Reversible causes (Hs and Ts)","src":["AHA25-ALS|Adult Cardiac Arrest Algorithm: reversible causes","RCUK25|Adult ALS algorithm: reversible causes"],"items":[["hypoxia","Hypoxia","Oxygen, airway position, tube in the right place (capnography)."],["hypovol","Hypovolaemia","Bleeding, vomiting, diarrhoea: fluids, blood."],["hion","Hydrogen ion (acidosis)","Diabetic ketoacidosis, kidney failure, long arrest."],["hyperk","Hyper- / hypokalaemia, other electrolytes","Dialysis patient? Wide QRS, peaked T: calcium, insulin with glucose, bicarbonate."],["hypot","Hypothermia","Check temperature."],["tension","Tension pneumothorax","Trauma, ventilated, one side not moving: needle decompression."],["tamp","Tamponade (cardiac)","Raised neck veins, after trauma or surgery: echo; pericardiocentesis."],["toxins","Toxins","Overdose, poisoning: specific antidote."],["pe","Thrombosis, pulmonary (PE)","Sudden breathlessness before collapse, leg swelling: consider fibrinolysis."],["mi","Thrombosis, coronary (MI)","Chest pain before the arrest: after ROSC, ECG and PCI."]]},"lysis_cx":{"title":"Fibrinolysis: contraindications","src":["ESC23-ACS|Contraindications to fibrinolytic therapy (table)","ACCAHA25-ACS|Contraindications to fibrinolytic therapy"],"groups":{"abs":"Absolute: do NOT give fibrinolysis","rel":"Relative: weigh benefit against bleeding (senior decision)"},"items":[["ich","Any previous brain bleed, or a stroke of unknown cause","abs"],["isch","Ischaemic stroke in the last 6 months","abs"],["cns","Brain or spinal damage, tumour or vascular malformation","abs"],["trauma","Major trauma, surgery or head injury in the last month","abs"],["gib","Bleeding from the gut in the last month","abs"],["bleed","Known bleeding disorder or active bleeding (not menses)","abs"],["aorta","Suspected aortic dissection","abs"],["punct","Puncture that cannot be pressed in the last 24 hours (e.g. liver biopsy, lumbar puncture)","abs"],["tia","TIA in the last 6 months","rel"],["oac","On an oral anticoagulant (warfarin, DOAC)","rel"],["preg","Pregnant or within 1 week after delivery","rel"],["bp","BP above 180/110 that does not come down","rel"],["liver","Advanced liver disease","rel"],["ie","Infective endocarditis","rel"],["pu","Active peptic ulcer","rel"],["cpr","Long or traumatic CPR","rel"]],"note":"ACC/AHA lists ischaemic stroke within 3 months as absolute (ESC: 6 months). The stricter ESC limit is used here (safer)."},"redflags":{"title":"Chest pain: red flags for other killers","src":["ESC23-ACS|Differential diagnosis of acute chest pain","AHAACC25-HBP|Acute aortic syndrome (compelling condition)"],"groups":{"aorta":"Aortic dissection","pe":"Pulmonary embolism","tamp":"Cardiac tamponade"},"items":[["a1","Sudden, severe, tearing or ripping pain, often to the back","aorta"],["a2","Pulse or BP difference between arms (more than 20 mmHg) or a missing pulse","aorta"],["a3","New aortic regurgitation murmur, or stroke signs with the pain","aorta"],["a4","Marfan, known aortic aneurysm or aortic valve disease","aorta"],["p1","Breathlessness with a clear chest, low SpO2, fast heart rate","pe"],["p2","Swollen tender calf, recent surgery, bed rest, cancer or pregnancy","pe"],["p3","Coughing blood, or previous DVT / PE","pe"],["t1","Low BP with raised neck veins and soft heart sounds","tamp"],["t2","BP falls more than 10 mmHg on breathing in (pulsus paradoxus)","tamp"],["t3","Low-voltage ECG or alternating QRS size; fluid around the heart on echo","tamp"]]},"rosc":{"title":"After ROSC: checklist","src":["AHA25-PCAC|Sections 4-13","ERC25-ALS|Immediate post-resuscitation care"],"items":[["air","Airway secure; waveform capnography; breathe 10 per minute","AHA 2025: PaCO2 35-45 mmHg."],["o2","Oxygen: 100% until SpO2 can be measured, then SpO2 90-98%","AHA 2025 4.1 (ERC: 94-98%)."],["bp","BP: MAP 65 mmHg or more (fluids, norepinephrine)","AHA 2025 section 5."],["ecg","12-lead ECG now","STEMI: emergency PCI (refer to NICVD), even if comatose."],["shock","Shock without STEMI: urgent angiography is reasonable","AHA 2025 section 10."],["glu","Glucose 70-180 mg/dL","AHA 2025 section 8."],["temp","Temperature control 32-37.5 C for at least 36 hours; prevent fever","AHA 2025 section 7 (ERC: prevent fever above 37.7 C for 72 h)."],["fits","Treat fits; EEG if not obeying commands","AHA 2025 section 13."],["cause","Find and treat the cause (Hs and Ts)",""],["xfer","Transfer to ICU / CCU with a doctor (NICVD for PCI)",""]]},"tod":{"title":"Acute organ damage from high BP","src":["AHAACC25-HBP|Section 6.2","ESC24-HTN|Hypertensive emergencies","ESC19-HTNEM|Types of hypertensive emergency"],"groups":{"aorta":"Aortic dissection","apo":"Acute pulmonary oedema","acs":"Acute coronary syndrome","stroke":"Stroke","enc":"Encephalopathy / malignant hypertension / acute kidney injury","sym":"Sympathetic crisis"},"items":[["d1","Tearing chest or back pain, pulse difference","aorta"],["o1","Breathless, crackles, frothy sputum","apo"],["c1","Ischaemic chest pain or new ischaemic ECG","acs"],["s1","New weakness, speech or face problem (stroke)","stroke"],["e1","Confusion, fits, severe headache with vomiting","enc"],["e2","Sudden loss of vision, retinal bleeding or papilloedema","enc"],["e3","Falling urine, rising creatinine, blood in urine","enc"],["y1","Cocaine / amphetamine, or pheochromocytoma attacks (headache, sweating, palpitations)","sym"]]}},"dx":{"vf":{"name":"Ventricular fibrillation (VF)","text":"Chaotic waves of varying size, no QRS complexes, no pulse.","src":["AHA25-ALS|Adult Cardiac Arrest Algorithm"]},"pvt":{"name":"Pulseless ventricular tachycardia","text":"Wide regular QRS complexes with no pulse: treat exactly as VF (shock).","src":["AHA25-ALS|Adult Cardiac Arrest Algorithm"]},"asys":{"name":"Asystole","text":"A flat line. Check leads, gain and pads before calling it; look for P waves (P-wave asystole may respond to pacing).","src":["AHA25-ALS|Adult Cardiac Arrest Algorithm"]},"pea":{"name":"Pulseless electrical activity (PEA)","text":"An organised rhythm on the monitor but no pulse. Look hard for a reversible cause (Hs and Ts).","src":["AHA25-ALS|Adult Cardiac Arrest Algorithm: reversible causes"]},"sinus_t":{"name":"Sinus tachycardia","text":"Normal P waves before each QRS, normal PR; the rate rose gradually and changes with the cause (fever, pain, low volume, low oxygen, anaemia, PE, thyroid, anxiety).","src":["RCUK25|Tachyarrhythmia algorithm note: in sinus tachycardia treat the cause","AHA25-ALS|Tachyarrhythmia algorithm box 1"]},"fat":{"name":"Focal atrial tachycardia","text":"A P wave before each QRS but with an abnormal shape or axis (e.g. upside-down in II), regular, often 120-220/min. Adenosine may stop it or only block the AV node for a moment (the P waves go on).","src":["ESC19-SVT|Focal atrial tachycardia"]},"flutter":{"name":"Atrial flutter","text":"Saw-tooth flutter waves (best in II, III, aVF, V1), atrial rate about 300; with 2:1 block the heart rate is about 150. Treat like AF (rate control, anticoagulation, cardioversion 200 J).","src":["ESC19-SVT|Atrial flutter","AHA25-ALS|Section 18 (AF and flutter)"]},"flutter_v":{"name":"Atrial flutter with varying block","text":"Flutter waves with an irregular ventricular rate. Treat like AF.","src":["ESC19-SVT|Atrial flutter"]},"avnrt":{"name":"AV nodal re-entrant tachycardia (AVNRT)","text":"Regular narrow tachycardia (often 140-250), sudden start; P waves hidden in the QRS or a small notch at its end (pseudo r' in V1). The commonest SVT.","src":["ESC19-SVT|AVNRT"]},"avrt":{"name":"AV re-entrant tachycardia (AVRT, accessory pathway / WPW)","text":"Regular narrow tachycardia with an upside-down P wave clearly after the QRS (RP interval about 70 ms or more). In sinus rhythm there may be a delta wave (WPW). Acute treatment is the same as AVNRT.","src":["ESC19-SVT|Orthodromic AVRT"]},"nrt":{"name":"Regular narrow-complex tachycardia (SVT, type not clear yet)","text":"Treated the same way first (vagal manoeuvre, adenosine). Adenosine on a rhythm strip often shows the type.","src":["ESC19-SVT|Acute management of regular narrow QRS tachycardia","AHA25-ALS|Section 17"]},"af":{"name":"Atrial fibrillation (AF)","text":"Irregularly irregular narrow QRS, no P waves, wavy or flat baseline.","src":["ESC24-AF|Definition and diagnosis"]},"af_bbb":{"name":"AF with bundle branch block","text":"Irregular wide QRS with the SAME shape every beat (typical bundle branch block). Treat as AF; if the QRS shape varies and some beats are very close, think of pre-excited AF.","src":["RCUK25|Tachyarrhythmia algorithm: broad irregular","ESC24-AF|AF with aberrant conduction (rate and rhythm control as for AF)"]},"mat":{"name":"Multifocal atrial tachycardia (MAT)","text":"Irregular narrow rhythm over 100 with P waves of 3 or more shapes and varying PR. Usually lung disease, low oxygen or low potassium / magnesium.","src":["ESC19-SVT|Multifocal atrial tachycardia"]},"sinus_ect":{"name":"Sinus tachycardia with ectopic beats","text":"Normal P waves with some early beats. Treat the cause.","src":["AHA25-ALS|Tachyarrhythmia algorithm box 1"]},"vt":{"name":"Monomorphic ventricular tachycardia (treat any regular wide tachycardia as VT)","text":"Regular wide QRS (0.12 s or more), the same shape each beat. AV dissociation, capture or fusion beats, very wide QRS or old MI make VT almost certain. If unsure: VT.","src":["ESC22-VA|Wide QRS tachycardia","AHA25-ALS|Section 15"]},"svt_ab":{"name":"SVT with known bundle branch block (aberrancy)","text":"Only when an old ECG shows the same QRS shape in sinus rhythm. Treat as SVT (vagal, adenosine); if anything does not fit, treat as VT.","src":["RCUK25|Known SVT with aberrant conduction: treat as narrow regular","AHA25-ALS|Section 15 (adenosine only if regular and monomorphic)"]},"pxaf":{"name":"Pre-excited atrial fibrillation (AF with WPW)","text":"Very fast irregular wide QRS (often over 200) whose shape changes from beat to beat, with some very short RR intervals; often a young patient. AV-node blockers can cause VF.","sets":["pxaf"],"src":["AHA25-ALS|Section 18.2 Rec 3 (harm from AV-nodal blockers and IV amiodarone)","ESC19-SVT|Pre-excited AF"]},"tdp":{"name":"Torsades de pointes (polymorphic VT with long QT)","text":"QRS complexes that twist around the baseline, with a long QT on the beats before. Often drugs, low potassium or magnesium, or slow heart rate.","sets":["lqt"],"src":["ESC22-VA|Torsades de pointes","RCUK25|Polymorphic VT with QT prolongation"]},"pmvt":{"name":"Polymorphic VT with a normal QT","text":"Twisting QRS with a normal QT: usually acute ischaemia.","src":["ESC22-VA|Polymorphic VT (ischaemia)"]},"pvt_unk":{"name":"Polymorphic VT (QT not known)","text":"Treat the rhythm first (defibrillate); magnesium is low-risk; check the QT once the rhythm settles.","src":["AHA25-ALS|Top message 8: polymorphic VT needs immediate defibrillation"]},"nsr":{"name":"Sinus rhythm (no arrhythmia)","text":"Normal P before every QRS, PR 0.12-0.20 s, rate 50-100.","src":["AHA25-ALS|Bradycardia / tachyarrhythmia algorithms (rate limits)"]},"sb":{"name":"Sinus bradycardia","text":"Normal P before every QRS, rate under 50. Common in fit people and in sleep; also drugs, low thyroid, inferior MI, raised brain pressure.","src":["AHA25-ALS|Bradycardia algorithm 2025"]},"avb1":{"name":"First-degree AV block","text":"Every P is followed by a QRS but the PR is longer than 0.20 s.","src":["ESC21-PACE|AV block"]},"mob1":{"name":"Second-degree AV block, Mobitz I (Wenckebach)","text":"The PR gets longer and longer until a P wave is not conducted; then it starts again. Usually at the AV node; often benign.","src":["ESC21-PACE|AV block"]},"mob2":{"name":"Second-degree AV block, Mobitz II (or 2:1 block)","text":"Some P waves are not conducted with a constant PR before them (or every second P is blocked). Risk of sudden complete block / asystole.","src":["ESC21-PACE|AV block","RCUK25|Bradyarrhythmia: risk of asystole (Mobitz II)"]},"chb":{"name":"Complete (third-degree) heart block, narrow escape","text":"P waves and QRS are unrelated; more P waves than QRS; regular narrow escape rhythm (junctional).","src":["ESC21-PACE|AV block"]},"chb_w":{"name":"Complete heart block with a wide (ventricular) escape","text":"P waves and QRS unrelated; slow wide escape rhythm. High risk of asystole; atropine rarely works.","src":["RCUK25|Bradyarrhythmia: complete heart block with broad QRS = risk of asystole","AHA25-ALS|Bradycardia algorithm"]},"junc":{"name":"Junctional rhythm","text":"Regular narrow QRS without P waves before it (P may be hidden or just after the QRS); escape rate 40-60, accelerated 60-100.","src":["ESC21-PACE|Sinus node and AV conduction disorders"]},"idio":{"name":"Ventricular escape (idioventricular) rhythm","text":"Very slow (20-40) wide QRS without P waves. High risk of asystole.","src":["RCUK25|Bradyarrhythmia: risk of asystole"]},"af_slow":{"name":"AF with a slow ventricular rate","text":"Irregular QRS without P waves, rate under 50: drugs (beta-blocker, calcium blocker, digoxin), conduction disease.","src":["ESC24-AF|Rate control drugs as a cause of slow AF","AHA25-ALS|Bradycardia algorithm"]},"af_ctrl":{"name":"AF with a controlled rate","text":"Irregular narrow QRS without P waves, rate 50-100.","src":["ESC24-AF|Diagnosis of AF; rate control target"]},"stemi":{"name":"ST-elevation myocardial infarction (STEMI)","text":"Ischaemic symptoms with new ST elevation at the J point in 2 neighbouring leads: 1 mm or more in all leads except V2-V3, where it is 2 mm or more in men 40 or over, 2.5 mm in men under 40, 1.5 mm in women. Equivalents: posterior MI (ST depression V1-V3 with ST elevation in V7-V9), new LBBB or paced rhythm with ongoing ischaemia.","src":["ESC23-ACS|ECG criteria for STEMI and STEMI equivalents","ACCAHA25-ACS|STEMI diagnosis"]}},"ptFields":{"preg":{"label":"Pregnant, or delivered in the last 6 weeks?","kind":"yesno","required":true},"age":{"label":"Age (years)","kind":"num","min":12,"max":110,"sets":{"age75":">=75"}},"wt":{"label":"Weight (kg, estimate if needed)","kind":"num","min":25,"max":250},"ckd":{"label":"Kidney function poor (eGFR or CrCl below 30, or on dialysis)","kind":"flag"},"wpw":{"label":"Known WPW / pre-excitation (delta wave)","kind":"flag"},"lqt":{"label":"Long QT (known, QTc over 500 ms now, or on QT-lengthening drugs)","kind":"flag"},"hfref":{"label":"Heart failure with low EF (LVEF 40% or less) or acute heart failure now","kind":"flag"},"asthma":{"label":"Asthma or COPD with wheeze","kind":"flag"}},"flagLabels":{"preg":"pregnant","age75":"age 75 or more","ckd":"poor kidney function","wpw":"known WPW","lqt":"long QT","hfref":"heart failure with low EF","asthma":"asthma / COPD","unstable":"unstable","pxaf":"pre-excited AF","af24":"AF under 24 hours","acg":"anticoagulant given"},"flows":{"dx":{"title":"Rhythm diagnosis","sub":"From the very start: pulse, rate, QRS, regularity, P waves, QT","start":"d_pulse","steps":{"d_pulse":{"type":"q","text":"Check for a pulse and normal breathing (no more than 10 seconds). Is there a pulse?","ans":[["No pulse, or not breathing normally","d_nopulse"],["Pulse present","d_pt"]],"src":["AHA25-ALS|Adult Cardiac Arrest Algorithm (start CPR)"]},"d_nopulse":{"warn":"Chest compressions: 100-120 per minute, at least 5 cm deep, full recoil.","type":"q","text":"Start CPR now. What does the monitor show?","ans":[["VF: chaotic waves, no QRS","x_vf"],["Wide regular QRS but no pulse (pulseless VT)","x_pvt"],["A flat line (asystole)","x_asys"],["A rhythm with QRS complexes but no pulse (PEA)","x_pea"]],"src":["AHA25-ALS|Adult Cardiac Arrest Algorithm (shockable or not)"]},"x_vf":{"type":"dx","dx":"vf","next":"c_s"},"x_pvt":{"type":"dx","dx":"pvt","next":"c_s"},"x_asys":{"type":"dx","dx":"asys","next":"c_n"},"x_pea":{"type":"dx","dx":"pea","next":"c_n"},"c_s":{"type":"code","rhythm":"shock"},"c_n":{"type":"code","rhythm":"nonshock"},"d_pt":{"type":"pt","ask":["preg","age","wt","ckd","wpw","lqt","hfref","asthma"],"next":"d_rate"},"d_rate":{"help":"A tachyarrhythmia that causes symptoms is usually 150 or more; under 150 look hard for a cause.","type":"q","text":"Heart rate (count the QRS complexes)?","ans":[["Fast: over 100 per minute","d_fast"],["Normal: 50 to 100","d_norm"],["Slow: under 50","d_slow"]],"src":["AHA25-ALS|Bradycardia algorithm (typically under 50) and Tachyarrhythmia algorithm (typically 150 or more)"]},"d_fast":{"type":"q","text":"Is the patient unstable because of the fast rhythm? Low BP or shock, fainting, ischaemic chest pain, acute heart failure, or confused.","ans":[["Unstable","d_fq",{"set":["unstable"]}],["Stable","d_fq"]],"src":["AHA25-ALS|Tachyarrhythmia algorithm box 2","RCUK25|Life-threatening features"]},"d_fq":{"type":"q","text":"QRS width?","ans":[["Narrow: under 0.12 s (under 3 small squares)","d_nreg"],["Wide: 0.12 s or more","d_wreg"]],"src":["AHA25-ALS|Tachyarrhythmia algorithm: wide QRS 0.12 s or more"]},"d_nreg":{"type":"q","text":"Is the narrow rhythm regular?","ans":[["Regular","d_nrp"],["Irregular","d_nip"]],"src":["RCUK25|Tachyarrhythmia algorithm: is QRS regular?"]},"d_nrp":{"help":"Adenosine on a rhythm strip can unmask flutter waves or atrial tachycardia.","type":"q","text":"Look at the P waves (lead II and V1). What do you see?","ans":[["Normal P before each QRS; the rate rose gradually (usually under 150)","x_sinus_t"],["A P before each QRS, but an abnormal shape (e.g. upside-down in II)","x_fat"],["Saw-tooth flutter waves (rate often about 150)","x_flutter"],["No P wave seen, or a small notch at the very end of the QRS","x_avnrt"],["An upside-down P clearly after the QRS, in the ST segment","x_avrt"],["Not sure","x_nrt"]],"src":["ESC19-SVT|Differential diagnosis of narrow QRS tachycardia (P-wave position)"]},"x_sinus_t":{"type":"dx","dx":"sinus_t","next":"tachy:t_sinus"},"x_fat":{"type":"dx","dx":"fat","next":"tachy:t_svt"},"x_flutter":{"type":"dx","dx":"flutter","next":"tachy:t_af"},"x_avnrt":{"type":"dx","dx":"avnrt","next":"tachy:t_svt"},"x_avrt":{"type":"dx","dx":"avrt","next":"tachy:t_svt"},"x_nrt":{"type":"dx","dx":"nrt","next":"tachy:t_svt"},"d_nip":{"type":"q","text":"P waves in the irregular narrow rhythm?","ans":[["No P waves; wavy or flat baseline","x_af"],["Flutter waves with varying block","x_flutter_v"],["P waves of 3 or more shapes, the PR varies","x_mat"],["Normal P waves with some early beats","x_sinus_ect"]],"src":["ESC24-AF|Diagnosis","ESC19-SVT|MAT and flutter"]},"x_af":{"type":"dx","dx":"af","next":"tachy:t_af"},"x_flutter_v":{"type":"dx","dx":"flutter_v","next":"tachy:t_af"},"x_mat":{"type":"dx","dx":"mat","next":"tachy:t_mat"},"x_sinus_ect":{"type":"dx","dx":"sinus_ect","next":"tachy:t_sinus"},"d_wreg":{"type":"q","text":"Is the wide rhythm regular?","ans":[["Regular","d_wr"],["Irregular","d_wip"]],"src":["RCUK25|Tachyarrhythmia algorithm: broad QRS, is it regular?"]},"d_wr":{"help":"Features of VT: P waves marching through (AV dissociation), capture or fusion beats, QRS over 0.16 s, extreme axis, old MI or heart disease.","type":"q","text":"Wide and regular. Is it clearly a known bundle branch block from an old ECG with exactly the same QRS shape?","ans":[["No, or not sure: treat as VT","x_vt"],["Yes: same QRS shape as the old ECG","x_svt_ab"]],"src":["ESC22-VA|Wide QRS tachycardia: treat as VT unless proven otherwise","RCUK25|Broad regular: treat as VT; known aberrancy: treat as narrow"]},"x_vt":{"type":"dx","dx":"vt","next":"tachy:t_vt"},"x_svt_ab":{"type":"dx","dx":"svt_ab","next":"tachy:t_svt"},"d_wip":{"type":"q","text":"Wide and irregular. What does the QRS look like?","ans":[["Each QRS a different size and direction, twisting around the line (polymorphic)","d_qt"],["Very fast (often over 200), the shape changes, some beats very close together (young, or known WPW)","x_pxaf"],["The same wide shape every beat, rhythm irregular","x_af_bbb"]],"src":["RCUK25|Broad irregular: AF with BBB, pre-excited AF, polymorphic VT","AHA25-ALS|Section 16 and 18.2"]},"d_qt":{"help":"QT-lengthening drugs include many antibiotics (azithromycin, levofloxacin), ondansetron, haloperidol, antimalarials and some antiarrhythmics.","type":"q","text":"Before the attack (or between runs) is the QT long (QTc over 500 ms), or is the patient on QT-lengthening drugs or low in potassium / magnesium?","ans":[["Yes: long QT","x_tdp"],["No, the QT is normal","x_pmvt"],["Not known","x_pvt_unk"]],"src":["ESC22-VA|Torsades de pointes vs polymorphic VT with normal QT"]},"x_pxaf":{"type":"dx","dx":"pxaf","next":"tachy:t_pxaf"},"x_af_bbb":{"type":"dx","dx":"af_bbb","next":"tachy:t_af"},"x_tdp":{"type":"dx","dx":"tdp","next":"tachy:t_poly"},"x_pmvt":{"type":"dx","dx":"pmvt","next":"tachy:t_poly"},"x_pvt_unk":{"type":"dx","dx":"pvt_unk","next":"tachy:t_poly"},"d_norm":{"type":"q","text":"Relation of the P waves to the QRS?","ans":[["A normal P before every QRS, PR 0.12-0.20 s","x_nsr"],["A P before every QRS, PR longer than 0.20 s","x_avb1"],["Some P waves not followed by a QRS; the PR lengthens before the dropped beat","x_mob1"],["Some P waves not followed by a QRS; the PR stays the same","x_mob2"],["P waves and QRS unrelated (more P waves than QRS)","x_chb"],["No P waves, regular narrow QRS","x_junc"],["No P waves, irregular","x_af_ctrl"]],"src":["ESC21-PACE|Classification of AV block and sinus node disease"]},"x_nsr":{"type":"dx","dx":"nsr","next":"d_nsr_end"},"x_af_ctrl":{"type":"dx","dx":"af_ctrl","next":"tachy:t_af_ctrl"},"d_nsr_end":{"type":"end","text":"No arrhythmia on this ECG. Look for the cause of the symptoms; repeat the ECG if they come back.","outcome":"No arrhythmia","src":["AHA25-ALS|Assessment"]},"d_slow":{"type":"q","text":"Is the slow rhythm causing danger signs? Shock or low BP, fainting, ischaemic chest pain, heart failure.","ans":[["Unstable","d_sp",{"set":["unstable"]}],["Stable","d_sp"]],"src":["AHA25-ALS|Bradycardia algorithm box 2","RCUK25|Bradyarrhythmia: life-threatening features"]},"d_sp":{"type":"q","text":"Relation of the P waves to the QRS?","ans":[["A normal P before every QRS, normal PR","x_sb"],["A P before every QRS, PR longer than 0.20 s","x_avb1"],["Some P waves blocked; the PR lengthens before the dropped beat","x_mob1"],["Some P waves blocked; the PR stays the same (or 2:1)","x_mob2"],["P waves and QRS unrelated; regular slow QRS","d_chbq"],["No P waves, narrow QRS (or P just after the QRS)","x_junc"],["No P waves, wide QRS, very slow (20-40)","x_idio"],["No P waves, irregular (slow AF)","x_af_slow"]],"src":["ESC21-PACE|Bradyarrhythmias","AHA25-ALS|Bradycardia algorithm"]},"d_chbq":{"type":"q","text":"Complete heart block: is the escape QRS narrow or wide?","ans":[["Narrow","x_chb"],["Wide","x_chb_w"]],"src":["RCUK25|Complete heart block with broad QRS: risk of asystole"]},"x_sb":{"type":"dx","dx":"sb","next":"brady:b_route"},"x_avb1":{"type":"dx","dx":"avb1","next":"brady:b_avb1"},"x_mob1":{"type":"dx","dx":"mob1","next":"brady:b_mob1"},"x_mob2":{"type":"dx","dx":"mob2","next":"brady:b_route"},"x_chb":{"type":"dx","dx":"chb","next":"brady:b_route"},"x_chb_w":{"type":"dx","dx":"chb_w","next":"brady:b_route"},"x_junc":{"type":"dx","dx":"junc","next":"brady:b_route"},"x_idio":{"type":"dx","dx":"idio","next":"brady:b_route"},"x_af_slow":{"type":"dx","dx":"af_slow","next":"brady:b_route"}}},"tachy":{"title":"Tachycardia with a pulse","sub":"Stable or unstable; drugs with alternatives; synchronised cardioversion","start":"t_pulse","steps":{"t_pulse":{"type":"q","text":"Is there a pulse?","ans":[["No pulse","arrest:a_code"],["Pulse present","t_pt"]],"src":["AHA25-ALS|Tachyarrhythmia algorithm (with a pulse)"]},"t_pt":{"type":"pt","ask":["preg","age","wt","ckd","wpw","lqt","hfref","asthma"],"next":"t_stab"},"t_stab":{"help":"Sinus tachycardia from another illness is not treated with cardioversion.","type":"q","text":"Unstable because of the tachycardia? Low BP or shock, fainting, ischaemic chest pain, acute heart failure, confused.","ans":[["Unstable","t_qrs",{"set":["unstable"]}],["Stable","t_qrs"]],"src":["AHA25-ALS|Tachyarrhythmia algorithm box 2","RCUK25|Life-threatening features"]},"t_qrs":{"type":"q","text":"QRS width?","ans":[["Narrow (under 0.12 s)","t_nreg"],["Wide (0.12 s or more)","t_wreg"],["I need help reading the rhythm","dx:d_rate"]],"src":["AHA25-ALS|Tachyarrhythmia algorithm: wide QRS?"]},"t_nreg":{"type":"q","text":"Narrow: regular or irregular?","ans":[["Regular","t_svt"],["Irregular","t_af"]],"src":["RCUK25|Narrow QRS: regular or irregular"]},"t_wreg":{"type":"q","text":"Wide: regular or irregular?","ans":[["Regular","t_vt"],["Irregular","t_wi"]],"src":["RCUK25|Broad QRS: regular or irregular"]},"t_wi":{"type":"q","text":"Wide and irregular: which?","ans":[["Polymorphic (twisting QRS)","t_poly"],["Very fast, the QRS shape varies (pre-excited AF)","t_pxaf",{"set":["pxaf"]}],["The same wide shape each beat (AF with bundle branch block)","t_af"]],"src":["RCUK25|Broad irregular tachycardia"]},"t_svt":{"type":"if","cond":"unstable","yes":"t_svt_cv","no":"t_vagal"},"t_svt_cv":{"result":[["Back to sinus rhythm","t_svt_ok"],["Still in tachycardia","@next"]],"src":["AHA25-ALS|Tachyarrhythmia algorithm box 6 and Electrical Cardioversion algorithm (narrow complex 100 J)","RCUK25|Unstable: synchronised shock up to 3 attempts, then amiodarone"],"type":"drug","text":"Unstable regular narrow tachycardia: synchronised cardioversion now (100 J). Adenosine may be tried while the defibrillator is made ready, but never delay the shock.","chain":["@sync_cv","amio_tachy","@refer_expert"],"next":"t_fail"},"t_vagal":{"result":[["Back to sinus rhythm","t_svt_ok"],["No change","@next"]],"src":["ESC19-SVT|Vagal manoeuvres (class I)","RCUK25|Vagal manoeuvres"],"type":"drug","text":"Stable regular narrow tachycardia: first a vagal manoeuvre.","chain":["@vagal"],"next":"t_aden"},"t_aden":{"result":[["Back to sinus rhythm","t_svt_ok"],["No change","@next"],["Shows flutter waves or P waves going on (atrial flutter / tachycardia)","t_af"]],"src":["AHA25-ALS|Section 17 Rec 2 and 5","RCUK25|Adenosine 6-12-18 mg, then verapamil or beta-blocker, then synchronised shock","ESC19-SVT|Acute therapy of narrow QRS tachycardia"],"type":"drug","text":"Then adenosine (if no asthma and no pre-excitation). Next options appear if it fails or is not available.","chain":["adenosine","verapamil","diltiazem","metoprolol_iv","esmolol","@sync_cv","@refer_expert"],"next":"t_fail"},"t_svt_ok":{"bullets":[{"if":"preg","t":"Pregnant: monitor the baby after any cardioversion; metoprolol is the preferred preventive drug (not atenolol)."}],"type":"do","text":"Converted. Record a 12-lead ECG in sinus rhythm (look for a delta wave of WPW, and the QT). Check potassium and magnesium. Observe for 1-2 hours; refer to cardiology OPD (ablation if it recurs).","next":"t_end_ok","src":["ESC19-SVT|After conversion: ECG in sinus rhythm; catheter ablation for recurrent SVT"]},"t_end_ok":{"type":"end","text":"Rhythm converted.","outcome":"Converted to sinus rhythm","src":["ESC19-SVT|Follow-up"]},"t_fail":{"type":"end","text":"Not converted: get expert help now and refer (senior, cardiologist, NICVD).","outcome":"Referred: not converted","src":["AHA25-ALS|If refractory: expert consultation"]},"t_af":{"type":"if","cond":"pxaf","yes":"t_pxaf","no":"t_af2"},"t_af2":{"type":"if","cond":"unstable","yes":"t_af_cv","no":"t_af_dur"},"t_af_cv":{"result":[["Back to sinus rhythm","t_af_ac"],["Still in AF / flutter","@next"]],"src":["AHA25-ALS|Section 18.1 Rec 3 and 5 (200 J)","ESC24-AF|Haemodynamically unstable AF: immediate electrical cardioversion"],"type":"drug","text":"Unstable AF or flutter: synchronised cardioversion now (AF 200 J, flutter 200 J). Heparin as soon as possible, but do not delay the shock.","chain":["@sync_cv","amio_tachy","@refer_expert"],"next":"t_fail"},"t_af_dur":{"type":"q","text":"When did this AF / flutter start?","ans":[["Clearly less than 24 hours ago","t_af_rate",{"set":["af24"]}],["24 hours ago or more, or not known","t_af_rate"]],"src":["ESC24-AF|Early cardioversion only if AF lasted less than 24 hours (otherwise anticoagulation or TOE first)","RCUK25|Anticoagulate if duration over 24 h"]},"t_af_rate":{"result":[["Rate now under 110 at rest","t_af_ac"],["Still fast","@next"]],"src":["ESC24-AF|Acute rate control: beta-blocker, diltiazem / verapamil (LVEF over 40%), digoxin; amiodarone in selected cases","AHA25-ALS|Section 18.2 Rec 1 and 4","RCUK25|Narrow irregular: rate control by EF"],"type":"drug","text":"Rate control. The app skips drugs that are unsafe for this patient. Lenient target: resting heart rate under 110.","chain":["metoprolol_iv","diltiazem","verapamil","esmolol","digoxin_iv","amio_tachy","@nondrug_rate"],"next":"t_af_ac"},"t_af_ac":{"type":"if","cond":"af24","yes":"t_af_ac_new","no":"t_af_ac_old"},"t_af_ac_new":{"bullets":[{"if":"preg","t":"Pregnant: rhythm control is preferred; use LMWH (DOACs are contraindicated in pregnancy); continue anticoagulation 4 weeks after cardioversion."}],"type":"do","text":"AF under 24 hours: start heparin (UFH or LMWH) unless contraindicated. Early cardioversion (electrical or drug) may be considered by the senior once stable; decide long-term anticoagulation with the CHA2DS2-VA score.","next":"t_af_end","src":["ESC24-AF|Anticoagulation around cardioversion; CHA2DS2-VA"]},"t_af_ac_old":{"bullets":[{"if":"preg","t":"Pregnant: LMWH; DOACs are contraindicated; involve the obstetrician."}],"type":"do","text":"AF for 24 hours or more, or unknown: do NOT cardiovert electively (stroke risk) unless unstable. Rate control; start heparin (UFH or LMWH); at least 3 weeks of anticoagulation, or TOE, before an elective cardioversion. Refer to cardiology.","next":"t_af_end","src":["ESC24-AF|Cardioversion of AF lasting over 24 h: 3 weeks of anticoagulation or imaging first"]},"t_af_end":{"type":"end","text":"AF / flutter managed: rate controlled and anticoagulation decided.","outcome":"Rate controlled","src":["ESC24-AF|Integrated AF management (rate control, anticoagulation)"]},"t_af_ctrl":{"type":"end","text":"AF with a controlled rate: no urgent rate treatment. Find the cause, decide anticoagulation (CHA2DS2-VA), refer to cardiology OPD.","outcome":"No urgent treatment","src":["ESC24-AF|Integrated AF management"]},"t_mat":{"result":[["Rate controlled","t_mat_end"],["Still fast","@next"]],"src":["ESC19-SVT|MAT: treat the underlying condition (class I); verapamil, diltiazem or a beta-1 selective blocker (IIa)"],"type":"drug","text":"MAT: treat the cause first (lung disease, low oxygen, low potassium / magnesium, sepsis). Cardioversion does not work. Rate control only if needed:","chain":["verapamil","diltiazem","metoprolol_iv","@refer_expert"],"next":"t_fail"},"t_mat_end":{"type":"end","text":"MAT controlled; keep treating the cause.","outcome":"Rate controlled","src":["ESC19-SVT|MAT"]},"t_sinus":{"type":"end","text":"Sinus tachycardia: treat the cause (fever, pain, low volume, low oxygen, anaemia, sepsis, PE, thyroid, anxiety). Never cardiovert it or give antiarrhythmics to slow it.","outcome":"Cause treated","src":["RCUK25|Tachyarrhythmia algorithm note (sinus tachycardia)","AHA25-ALS|Box 1: assess whether the rate fits the condition"]},"t_vt":{"type":"if","cond":"unstable","yes":"t_vt_cv","no":"t_vt_q"},"t_vt_cv":{"result":[["Back to sinus rhythm","t_vt_ok"],["Still in VT","@next"]],"src":["AHA25-ALS|Electrical Cardioversion algorithm (monomorphic VT 100 J)","RCUK25|Synchronised shock up to 3 attempts, then amiodarone 300 mg or procainamide"],"type":"drug","text":"Synchronised cardioversion (monomorphic VT 100 J; raise the energy if it fails, up to 3 attempts). If the pulse is lost: CPR and Code mode.","chain":["@sync_cv","amio_tachy","procainamide","lido_vt","@refer_expert"],"next":"t_fail"},"t_vt_q":{"help":"AHA 2025: adenosine may be tried only if the rhythm is regular and monomorphic, to help diagnosis. Never verapamil or diltiazem for a wide tachycardia.","type":"q","text":"Stable VT. Can a skilled doctor sedate the patient and cardiovert now?","ans":[["Yes: cardiovert","t_vt_cv"],["No: give a drug first","t_vt_drug"]],"src":["ESC22-VA|Tolerated monomorphic VT: electrical cardioversion first if sedation risk is low (class I); IV procainamide (IIa) or amiodarone (IIb)","AHA25-ALS|Section 15 Rec 2-3"]},"t_vt_drug":{"result":[["Back to sinus rhythm","t_vt_ok"],["Still in VT","@next"]],"src":["AHA25-ALS|Section 15 Rec 3 (procainamide, amiodarone, sotalol may be considered)","RCUK25|Procainamide 10-15 mg/kg, or amiodarone 300 mg if not available"],"type":"drug","text":"Antiarrhythmic for stable VT:","chain":["amio_tachy","procainamide","lido_vt","@sync_cv","@refer_expert"],"next":"t_fail"},"t_vt_ok":{"type":"do","text":"Converted: 12-lead ECG, potassium and magnesium, look for ischaemia (chest pain flow), echo. Refer to cardiology / NICVD (cause, ICD assessment).","next":"t_end_ok","src":["ESC22-VA|After VT: evaluation for structural heart disease"]},"t_poly":{"src":["AHA25-ALS|Top message 8 and Electrical Cardioversion algorithm (polymorphic VT: unsynchronised high-energy shock)"],"type":"drug","text":"Polymorphic VT is always unstable: DEFIBRILLATE (unsynchronised) now. If the pulse is lost: CPR and Code mode.","chain":["@defib"],"next":"t_poly_r"},"t_poly_r":{"type":"q","text":"After the shock?","ans":[["Pulse lost: cardiac arrest","arrest:a_code_s"],["Stopped (or keeps coming back)","t_poly_qt"]],"src":["AHA25-ALS|Adult Cardiac Arrest Algorithm"]},"t_poly_qt":{"type":"if","cond":"lqt","yes":"t_tdp","no":"t_pmvt"},"t_tdp":{"src":["RCUK25|Torsades: magnesium 8 mmol over 10 min; isoprenaline or pacing; avoid amiodarone","ESC22-VA|Torsades: magnesium, potassium, stop offending drugs"],"type":"drug","text":"Torsades (long QT): magnesium. Correct potassium to 4.5-5.0. Stop QT-lengthening drugs. Do NOT give amiodarone.","chain":["mag_tdp","@tdp_care"],"next":"t_tdp_more"},"t_tdp_more":{"result":[["Settled","t_tdp_end"],["Still recurring","@next"]],"src":["RCUK25|Torsades: isoprenaline or temporary pacing to increase heart rate","ESC22-VA|Overdrive pacing / isoproterenol in acquired long QT"],"type":"drug","text":"If it keeps coming back with slow heart rate or pauses: raise the heart rate.","chain":["isoprenaline","@tcp","@refer_expert"],"next":"t_tdp_end"},"t_tdp_end":{"type":"end","text":"Torsades treated: monitor, keep potassium 4.5-5.0 and magnesium normal, no QT-lengthening drugs; refer to cardiology.","outcome":"Treated","src":["ESC22-VA|Torsades"]},"t_pmvt":{"src":["ESC22-VA|Polymorphic VT in acute ischaemia: beta-blockers, amiodarone, urgent revascularisation"],"type":"drug","text":"Polymorphic VT with a normal QT: usually acute ischaemia. ECG for STEMI; urgent angiography (NICVD). To prevent recurrences:","chain":["amio_tachy","metoprolol_iv","@refer_nicvd"],"next":"t_pmvt_end"},"t_pmvt_end":{"type":"end","text":"Refer to NICVD for urgent angiography. Open the chest pain flow if there is chest pain.","outcome":"Referred to NICVD","src":["ESC22-VA|Urgent coronary angiography"]},"t_pxaf":{"type":"if","cond":"unstable","yes":"t_px_cv","no":"t_px_drug"},"t_px_cv":{"result":[["Back to sinus rhythm","t_px_ok"],["Still in AF","@next"]],"src":["ESC19-SVT|Pre-excited AF: urgent electrical cardioversion if unstable","AHA25-ALS|Section 18.1"],"type":"drug","text":"Unstable pre-excited AF: synchronised cardioversion now (200 J).","chain":["@sync_cv","@refer_expert"],"next":"t_fail"},"t_px_drug":{"result":[["Back to sinus rhythm","t_px_ok"],["Still in AF","@next"]],"warn":"No AV-node blockers in pre-excited AF.","src":["AHA25-ALS|Section 18.2 Rec 3 (harm)","ESC19-SVT|Pre-excited AF: ibutilide or procainamide (IIa), flecainide (IIb), cardioversion","RCUK25|AF with pre-excitation: procainamide or cardioversion"],"type":"drug","text":"Stable pre-excited AF. NEVER give adenosine, verapamil, diltiazem, beta-blockers, digoxin or IV amiodarone (they can cause VF).","chain":["procainamide","ibutilide","flecainide_iv","@sync_cv","@refer_expert"],"next":"t_fail"},"t_px_ok":{"type":"do","text":"Converted: refer to NICVD / electrophysiology for ablation of the accessory pathway.","next":"t_end_ok","src":["ESC19-SVT|Catheter ablation for pre-excited AF"]}}},"brady":{"title":"Bradycardia with a pulse","sub":"Atropine, infusions and pacing, with alternatives","start":"b_pulse","steps":{"b_pulse":{"type":"q","text":"Is there a pulse?","ans":[["No pulse","arrest:a_code"],["Pulse present","b_pt"]],"src":["AHA25-ALS|Bradycardia algorithm (with a pulse)"]},"b_pt":{"type":"pt","ask":["preg","age","wt","ckd"],"next":"b_stab"},"b_stab":{"type":"q","text":"Is the slow rhythm causing danger signs? Shock or low BP, fainting, ischaemic chest pain, heart failure, confused.","ans":[["Unstable","b_unstable",{"set":["unstable"]}],["Stable","b_risk"]],"src":["AHA25-ALS|Bradycardia algorithm box 2","RCUK25|Bradyarrhythmia: life-threatening features"]},"b_route":{"type":"if","cond":"unstable","yes":"b_unstable","no":"b_risk"},"b_unstable":{"type":"do","text":"Unstable bradycardia: oxygen if SpO2 is low, IV access, 12-lead ECG, pacing pads on now. Look for causes: inferior MI, drugs (beta-blocker, calcium blocker, digoxin), high potassium, low oxygen.","next":"b_atropine","src":["AHA25-ALS|Bradycardia algorithm box 3 and possible causes"]},"b_atropine":{"result":[["Heart rate and BP better","b_better"],["No better","@next"]],"extra":[["Go to pacing now","b_tcp"]],"src":["AHA25-ALS|Bradycardia algorithm box 5: atropine; if ineffective, transcutaneous pacing and/or dopamine or epinephrine infusion","RCUK25|Interim measures: atropine, isoprenaline, adrenaline, alternatives, transcutaneous pacing"],"type":"drug","text":"Atropine first. If it does not work: transcutaneous pacing and/or an adrenaline or dopamine infusion. Pacing can be started at any time.","chain":["atropine","epi_inf","dopamine","isoprenaline","@tcp","@refer_expert"],"next":"b_fail"},"b_tcp":{"result":[["Capture and better","b_better"],["Not better","@next"]],"src":["AHA25-ALS|Bradycardia algorithm box 5-6","RCUK25|Transcutaneous pacing; seek expert help"],"type":"drug","text":"Transcutaneous pacing (with pain relief / sedation).","chain":["@tcp","epi_inf","dopamine","isoprenaline","@refer_expert"],"next":"b_fail"},"b_better":{"type":"do","text":"Better. Keep the pads on. High-grade block (Mobitz II, complete heart block, wide escape) needs transvenous / permanent pacing: refer to NICVD. Treat the cause.","next":"b_end","src":["AHA25-ALS|Bradycardia algorithm box 6: consider transvenous pacing, expert consultation","ESC21-PACE|Temporary pacing as a bridge"]},"b_end":{"type":"end","text":"Bradycardia managed.","outcome":"Stabilised","src":["AHA25-ALS|Bradycardia algorithm"]},"b_fail":{"type":"end","text":"Not responding: expert help and urgent transfer for transvenous pacing (NICVD).","outcome":"Referred for pacing","src":["AHA25-ALS|Expert consultation, transvenous pacing"]},"b_risk":{"type":"q","text":"Is there a risk of asystole? Recent asystole, Mobitz II, complete heart block with wide QRS, or pauses over 3 seconds.","ans":[["Yes","b_highrisk"],["No","b_stable"]],"src":["RCUK25|Bradyarrhythmia: risk of asystole"]},"b_highrisk":{"type":"do","text":"High risk even if stable now: keep monitored with pacing pads on and atropine drawn up; refer for transvenous / permanent pacing (NICVD).","next":"b_hr_end","src":["RCUK25|Risk of asystole: seek expert help, transvenous pacing","ESC21-PACE|Pacing for high-degree AV block"]},"b_hr_end":{"type":"end","text":"Referred for pacing; monitored meanwhile.","outcome":"Referred for pacing","src":["ESC21-PACE|Pacing indications in AV block"]},"b_stable":{"type":"end","text":"Stable and low risk: observe on the monitor, 12-lead ECG, look for causes (drugs, potassium, thyroid, ischaemia; athletes and sleep).","outcome":"Observed","src":["AHA25-ALS|Bradycardia algorithm box 7: identify and treat causes, observe"]},"b_avb1":{"type":"end","text":"First-degree AV block: no treatment. Review drugs (beta-blocker, calcium blocker, digoxin), potassium and ischaemia.","outcome":"No treatment needed","src":["ESC21-PACE|First-degree AV block"]},"b_mob1":{"type":"if","cond":"unstable","yes":"b_unstable","no":"b_mob1_end"},"b_mob1_end":{"type":"end","text":"Mobitz I (Wenckebach): usually benign (often inferior MI or drugs). Observe; if symptoms appear treat as bradycardia.","outcome":"Observed","src":["ESC21-PACE|Second-degree AV block type I"]}}},"arrest":{"title":"Cardiac arrest (Code mode)","sub":"ACLS with the team leader's clock and recorder","start":"a_code","steps":{"a_code":{"type":"code","rhythm":null},"a_code_s":{"type":"code","rhythm":"shock"}}},"rosc":{"title":"After ROSC (post-cardiac arrest care)","sub":"Targets, ECG, shock, transfer","start":"r_check","steps":{"r_check":{"next":"r_ecg","type":"check","text":"After ROSC: go through the checklist.","list":"rosc","src":["AHA25-PCAC|Sections 4-13"]},"r_ecg":{"type":"q","text":"12-lead ECG after ROSC: what does it show?","ans":[["STEMI","r_stemi"],["No STEMI, but the patient is in shock","r_shock"],["No STEMI, BP adequate","r_end"]],"src":["AHA25-PCAC|Section 6 (ECG) and 10 (angiography)"]},"r_stemi":{"type":"do","text":"STEMI after ROSC: emergency angiography / PCI even if the patient is comatose. Refer to NICVD now.","next":"r_end_ref","src":["AHA25-PCAC|Section 10 Rec 1 (class 1)"]},"r_shock":{"src":["AHA25-PCAC|Section 5 (MAP 65 or more) and Section 10 Rec 3"],"type":"drug","text":"Shock after ROSC: keep MAP 65 mmHg or more; consider urgent angiography (cardiogenic shock).","chain":["norepinephrine","epi_inf","dopamine","@pressor_none"],"next":"r_end_ref"},"r_end_ref":{"type":"end","text":"Transfer to NICVD / ICU with a doctor.","outcome":"Transferred","src":["AHA25-PCAC|Section 10 (angiography) and transfer to critical care"]},"r_end":{"type":"end","text":"Continue post-arrest care in ICU / CCU; find the cause.","outcome":"Post-arrest care","src":["AHA25-PCAC|Sections 4-13 (post-arrest bundle)"]}}},"acs":{"title":"Chest pain, ACS and STEMI","sub":"ECG in 10 minutes, red flags, thrombolysis or NICVD","start":"c_ecg0","steps":{"c_ecg0":{"label":"ECG done","log":"ECG recorded","type":"do","text":"Record a 12-lead ECG within 10 minutes of arrival and show it to the doctor at once. Monitor, IV access, SpO2.","next":"c_pt","src":["ESC23-ACS|ECG within 10 minutes of first medical contact","ACCAHA25-ACS|ECG within 10 minutes"]},"c_pt":{"type":"pt","ask":["preg","age","wt","ckd"],"next":"c_unst"},"c_unst":{"type":"q","text":"Is the patient unstable? Shock or low BP, acute heart failure, dangerous arrhythmia.","ans":[["Cardiac arrest","arrest:a_code"],["Unstable","c_red",{"set":["unstable"]}],["Stable","c_red"]],"src":["ESC23-ACS|Very high-risk features"]},"c_red":{"rules":[{"any":"aorta","to":"c_aorta"},{"any":"tamp","to":"c_tamp"},{"any":"pe","to":"c_pe"}],"else":"c_ecg","type":"check","text":"Before treating as ACS, tick any red flag of another killer:","list":"redflags","src":["ESC23-ACS|Differential diagnosis of acute chest pain"]},"c_aorta":{"warn":"No thrombolysis, no heparin, no aspirin.","type":"do","text":"Suspected aortic dissection: NO fibrinolysis, NO heparin and NO antiplatelet drugs until it is excluded. Pain relief; heart rate under 60 and SBP under 120; urgent CT aorta; refer to NICVD (cardiac surgery).","next":"bp:p_aorta","src":["AHAACC25-HBP|Section 6.2: SBP below 120 in the first hour in aortic dissection","ESC19-HTNEM|Acute aortic disease: SBP below 120 and HR below 60","ESC23-ACS|Contraindications to fibrinolysis (aortic dissection)"]},"c_tamp":{"type":"end","text":"Suspected tamponade: bedside echo now. Fluid bolus if low BP; avoid diuretics and nitrates; urgent pericardiocentesis (refer to NICVD if it cannot be done here).","outcome":"Referred: possible tamponade","src":["ESC23-ACS|Differential diagnosis","AHA25-ALS|Reversible causes (tamponade)"]},"c_pe":{"type":"end","text":"Possible pulmonary embolism: oxygen,
