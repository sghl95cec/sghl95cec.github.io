<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEC Daily Census, SGHL</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a4a2b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--g9:#0a4a2b;--g7:#0e6238;--g6:#127a46;--g1:#e4f1e9;--g0:#f1f7f3;--ink:#18201b;--mute:#5a655e;--line:#d6ddd8;--bg:#eef1ef;--red:#9e1c1c;--red0:#fbecec;--amb:#7a4b00;--amb0:#fff3d9;--r:10px;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.top{background:var(--g9);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;border-bottom:3px solid #c9a227}
.top .lg{width:50px;height:50px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top .lg img{width:31px;height:38px;margin-top:-2px}
.top .t1{font-size:10.5px;letter-spacing:.14em;opacity:.85}
.top .t2{font-size:16px;font-weight:600;line-height:1.2}
.top .t3{font-size:12.5px;opacity:.9}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs button{flex:1;border:0;background:none;padding:12px 2px 10px;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);border-bottom:3px solid transparent}
.tabs button.on{color:var(--g7);border-bottom-color:var(--g7)}
main{max-width:680px;margin:0 auto;padding:12px 12px 120px}
.banner{max-width:680px;margin:10px auto 0;padding:0 12px}
.banner div{padding:9px 12px;border-radius:8px;font-size:13px;background:var(--amb0);color:var(--amb);border:1px solid #f0d9a8}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.ct{margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g7)}
.muted{color:var(--mute)}
.small{font-size:12.5px}
.center{text-align:center}
label.lb{display:block;font-size:12.5px;font-weight:600;color:#38423c;margin:12px 0 5px;letter-spacing:.02em}
label.lb .req{color:var(--red)}
input.in,select.in,textarea.in{width:100%;height:46px;border:1px solid #bfc8c2;border-radius:8px;padding:0 12px;background:#fff;font-size:16px;outline:none}
textarea.in{height:auto;padding:10px 12px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--g6);box-shadow:0 0 0 3px rgba(18,122,70,.15)}
.row2{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:8px;border:1px solid #b9c3bd;background:#fff;font-weight:600;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.99)}
.btn.pri{background:var(--g7);border-color:var(--g7);color:#fff}
.btn.dan{color:var(--red);border-color:#e3b5b5}
.btn.danf{background:var(--red);border-color:var(--red);color:#fff}
.btn.block{width:100%;margin-top:14px}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn[disabled]{opacity:.55}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;min-height:44px;padding:6px 12px;border:1px solid #bfc8c2;border-radius:8px;background:#fff;font-weight:600;font-size:14px;line-height:1.2}
.seg button small{display:block;font-weight:400;font-size:11.5px;color:var(--mute)}
.seg button.on{background:var(--g7);border-color:var(--g7);color:#fff}
.seg button.on small{color:#d5eadc}
.seg.cats button{flex:1 1 30%}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.stats div{background:var(--g0);border:1px solid #dbe8df;border-radius:8px;padding:8px 6px;text-align:center}
.stats b{display:block;font-size:22px;line-height:1.1;color:var(--g9)}
.stats span{font-size:11.5px;color:var(--mute);letter-spacing:.03em}
.catline{margin-top:10px;font-size:12.5px;color:var(--mute)}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sc-top h2{margin:2px 0;font-size:19px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--g6);font-weight:700}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.open{background:var(--g1);color:var(--g7)}
.pill.closed{background:#e9ecea;color:#3d4741}
.pill.none{background:#fff;color:var(--mute);border:1px dashed #c4ccc7}
.kv{margin-top:8px;font-size:14px}
.warn{margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--amb0);color:var(--amb);font-size:13px;border:1px solid #f0d9a8}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 2px 8px}
.listhead h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#38423c}
.listhead input{max-width:52%;height:38px;font-size:14px}
.plist{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #e8ece9;padding:11px 12px;cursor:pointer}
.prow:last-child{border-bottom:0}
.prow:active{background:var(--g0)}
.pr-l{width:44px;flex-shrink:0;text-align:center}
.pr-no{font-weight:700;color:var(--g7);font-size:14px}
.pr-t{font-size:11.5px;color:var(--mute)}
.pr-m{min-width:0;flex:1}
.pr-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-sub{font-size:13px;color:var(--mute);margin-top:1px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;margin-right:4px;background:#eef1ef;color:#3d4741;letter-spacing:.02em}
.tag.EMR{background:#fdeaea;color:#8c1d1d}.tag.BD{background:#2b2b2b;color:#fff}.tag.OPD{background:#e6f0fb;color:#14497e}.tag.ETT,.tag.ECHO{background:#efe9fb;color:#4b2f8a}
.tag.REF{background:#fff1d6;color:#7a4b00}.tag.EXP{background:#2b2b2b;color:#fff}.tag.LAMA{background:#fff1d6;color:#7a4b00}
.empty{padding:26px 14px;text-align:center;color:var(--mute);font-size:14px}
.actions{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
.actions .in2{max-width:680px;margin:0 auto;display:flex;gap:10px}
.actions .btn{flex:1}
.actions .btn.pri{flex:2}
.sheet{position:fixed;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--g9);color:#fff}
.sh-head h3{margin:0;font-size:16px;letter-spacing:.04em}
.sh-head button{background:none;border:0;color:#fff;font-weight:600;font-size:15px;padding:8px 4px;min-width:60px;text-align:left}
.sh-head span{min-width:60px;text-align:right;font-size:13px;opacity:.85}
.sh-body{flex:1;overflow-y:auto;padding:4px 14px 20px;max-width:680px;width:100%;margin:0 auto}
.sh-foot{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:680px;width:100%;margin:0 auto}
.sh-foot .btn{flex:1;padding:0 8px}
.dxlist{border:1px solid var(--line);border-radius:8px;margin-top:6px;max-height:232px;overflow-y:auto}
.dxlist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eef1ef;background:#fff;padding:11px 12px;font-size:15px}
.dxlist button:last-child{border-bottom:0}
.dxlist button.add{color:var(--g7);font-weight:600}
.dxlist .gh{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:8px 12px 4px;background:#f7f9f8}
.dxpick{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--g6);background:var(--g0);border-radius:8px;padding:8px 8px 8px 12px;font-weight:600;color:var(--g9)}
.err{margin-top:12px;padding:9px 11px;border-radius:8px;background:var(--red0);color:var(--red);font-size:13.5px}
.dup{background:var(--amb0);color:var(--amb)}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}
.mbox{background:#fff;border-radius:12px;max-width:420px;width:100%;padding:18px}
.mbox h3{margin:0 0 8px;font-size:17px}
.mbox p{margin:0 0 6px;color:#38423c;font-size:14.5px}
.mbtns{display:flex;gap:10px;margin-top:16px}
.mbtns .btn{flex:1}
.mbtns.col{flex-direction:column;gap:8px}.mbtns.col .btn{flex:0 0 auto;width:100%;white-space:normal;text-align:center}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1d2721;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:90%;text-align:center}
.srow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.srow h4{margin:0;font-size:16px}
.sbtns{display:flex;gap:8px;margin-top:10px}
.sbtns .btn{flex:1}
.datenav{display:flex;gap:8px;align-items:center}
.datenav .in{text-align:center}
.datenav .btn{min-width:46px;padding:0}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stats3 div{background:var(--g0);border:1px solid #dbe8df;border-radius:8px;padding:8px;text-align:center}
.stats3 b{display:block;font-size:22px;color:var(--g9)}
.stats3 span{font-size:11.5px;color:var(--mute)}
.lv-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lv-head h2{margin:0;font-size:16px}
.lv-act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:10px;margin:12px 2px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--g7)}
.paperwrap{overflow:hidden;border-radius:6px}
.paper{width:794px;transform-origin:top left;font-family:"Times New Roman",Times,"Noto Serif",serif;color:#000}
.paper .page{background:#fff;padding:40px 60px 56px;min-height:1123px;position:relative;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.18);font-size:15.5px;line-height:1.45}
.paper .lh{display:flex;align-items:center;gap:14px}
.paper .lh img{width:76px;height:94px}
.paper .lht{flex:1;text-align:center;font-weight:700}
.paper .l1{font-size:15.5px}.paper .l2{font-size:19px}.paper .l3{font-size:16.5px}
.paper .rule{border-top:2.5px solid #000;border-bottom:1px solid #000;height:5px;margin:10px 0 16px}
.paper .refrow{display:flex;justify-content:space-between}
.paper .to{margin-top:18px}.paper .addr{margin-left:38px}
.paper .subj{display:flex;gap:12px;margin:18px 0 12px;font-weight:700}
.paper .subj span{text-decoration:underline}
.paper p{margin:6px 0}.paper .ind{text-indent:38px}
.paper .sh{font-weight:700;margin:16px 0 6px}
.paper table.lt{width:100%;border-collapse:collapse;font-size:13px}
.paper .lt th,.paper .lt td{border:1px solid #000;padding:2px 6px}
.paper .lt th{background:#dbdbdb;text-align:left}
.paper .lt .c{text-align:center}.paper .lt .r{text-align:right}
.paper .lt tr.tot td{font-weight:700;background:#f0f0f0}
.paper .notes{font-style:italic;margin-top:10px;font-size:14.5px}
.paper .signs{display:flex;justify-content:flex-end;margin-top:22px}
.paper .sign{width:250px;font-size:14.5px}
.paper .sign .pre{font-weight:700}
.paper .sign .sl{border-bottom:1px solid #000;width:220px;height:50px}
.paper .sign .sn{font-weight:700;margin-top:4px}
.paper .copy{margin-top:22px;font-size:14.5px}.paper .copy ol{margin:4px 0 0 4px}
.paper .foot{position:absolute;left:60px;right:60px;bottom:22px;border-top:1px solid #999;padding-top:4px;font-size:11px;color:#555;font-family:Arial,sans-serif}
.paper .ah{text-align:center;font-weight:700;font-size:16px}.paper .aref{text-align:center;font-size:13px;margin-bottom:10px}
.paper .legend{font-style:italic;font-size:12.5px;margin-top:6px}

.set-doc textarea{min-height:110px}
.linkbox{word-break:break-all;background:var(--g0);padding:10px;border-radius:8px;font-size:13px;margin-top:8px}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid #cfd8d2;border-top-color:var(--g7);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.role{margin-top:8px;font-size:13.5px;color:#38423c;line-height:1.5}
.pill.ctrl{background:var(--g7);color:#fff;margin-right:4px}
.userbar{max-width:680px;margin:0 auto;padding:7px 14px;font-size:12.5px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:10px}
.lnk{background:none;border:0;color:var(--g7);font-weight:600;font-size:12.5px;padding:4px 0;cursor:pointer}
.fsec{margin:18px 0 2px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--g7)}
.fsec:first-child{border-top:0;padding-top:4px;margin-top:8px}
.fnote{margin:14px 0 0;padding:9px 11px;background:var(--g0);border-radius:8px}
.signed{margin:8px 0 0;padding:8px 11px;border-radius:8px;background:var(--g1);color:var(--g9);font-size:13.5px;font-weight:600}
.seg.procs button,.seg.outs button{flex:1 1 44%;min-height:40px;font-size:13.5px;font-weight:500}
.seg.filt{margin-bottom:4px}.seg.filt button{min-height:38px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:24px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--g1);color:var(--g9);border:1px solid #b9d9c5;border-radius:16px;padding:4px 6px 4px 11px;font-size:13.5px;font-weight:600}
.chip button{border:0;background:none;color:var(--g9);font-size:17px;line-height:1;padding:0 4px;cursor:pointer}
.tag.wait{background:#fff1d6;color:#7a4b00}.tag.ok{background:var(--g1);color:var(--g9)}.tag.out{background:#eef1ef;color:#3d4741}
.pr-proc{font-size:12px;color:#4b2f8a;margin-top:2px}
.pr-audit{font-size:11.5px;color:var(--mute);margin-top:4px;font-style:italic}
.stats div.w{background:#fff6e3;border-color:#f0d9a8}.stats div.w b{color:#7a4b00}
.card.ho{border-color:#f0d9a8;background:#fffbf2}
.horow{padding:7px 0;border-bottom:1px solid #f3e6c8;font-size:14px}.horow:last-child{border-bottom:0}
.urow{padding:10px 0;border-bottom:1px solid #e8ece9;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.urow:last-child{border-bottom:0}.urow>div:first-child{min-width:0;flex:1 1 60%}
.urow .sbtns{width:100%;margin-top:4px}
.rights{display:flex;flex-direction:column;gap:6px;width:100%;font-size:14px}
.rights label{display:flex;gap:8px;align-items:center}.rights input{width:19px;height:19px;accent-color:var(--g7)}
.log{max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0}
.lrow{display:flex;gap:10px;padding:8px 10px;border-bottom:1px solid #eef1ef;font-size:13px}
.ltm{flex:0 0 92px;color:var(--mute);font-size:12px}
.sh-head .del{background:none;border:0;color:#ffd5d5;font-weight:600;font-size:15px;min-width:60px;text-align:right;padding:8px 4px}
.paper .tnote{font-style:italic;font-size:12.5px;margin-top:3px}
.paper .annex .lt{font-size:11.5px}.paper .annex .lt th,.paper .annex .lt td{padding:2px 4px}
.addrow{display:flex;gap:8px;margin-top:6px}.addrow .in{flex:1}.addrow .btn{flex:0 0 auto}
.drow{padding:11px 12px;border-bottom:1px solid #e8ece9}.drow:last-child{border-bottom:0}
.sbtns{flex-wrap:wrap}
.sbtns.ico .btn{gap:5px}
.paper .dc{padding:34px 46px 40px;font-family:Arial,Helvetica,sans-serif;font-size:13px;border:3px double #000;margin:0}
.paper .dch{display:flex;align-items:center;gap:16px}.paper .dch img{width:74px;height:91px}
.paper .dch>div{flex:1;text-align:center;font-family:"Times New Roman",serif;font-weight:700}
.paper .dch .d1{font-size:21px}.paper .dch .d2{font-size:14px}.paper .dch .d3{font-size:11px;margin-top:4px}
.paper .dcmeta{display:flex;justify-content:space-between;font-size:12px;margin:6px 0 8px}
.paper .dct{width:330px;margin:4px auto 14px;border:3px double #000;text-align:center;font-weight:700;letter-spacing:.32em;font-size:17px;padding:5px}
.paper table.dt{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12.5px}
.paper .dt th{border:1px solid #000;font-size:11px;letter-spacing:.18em;padding:4px;background:#fff}
.paper .dt td{border:1px solid #000;padding:5px 7px;vertical-align:top}
.paper .dt td.lbl{width:20%}.paper .dt td.half{width:50%}
.paper .dt .v{color:#0b3a73;font-weight:600}
.paper .dt .ck{margin:4px 0}.paper .dt .cm{margin-top:6px;white-space:pre-wrap;color:#0b3a73;font-weight:600;min-height:90px}
.paper .dcs{display:flex;justify-content:space-between;margin-top:24px;text-align:center;font-size:12px}
.paper .dcs>div{width:260px}.paper .dcs .box{height:62px;border:1px solid #000;border-bottom:0}
.paper .dcs>div{border-bottom:1px solid #000}

/* ---------- app bar and menu ---------- */
.appbar{position:sticky;top:0;z-index:16}
.top{border-bottom:3px solid #c9a227}
.top .tt{min-width:0;flex:1}
.top .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menubtn{flex-shrink:0;display:flex;align-items:center;gap:7px;min-height:42px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.menubtn[aria-expanded=true]{background:#fff;color:var(--g9)}
.nav{background:#fff}
.nav .ni>button,.nav .sub button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.nav .ni>button{padding:13px 16px;font-size:15.5px;font-weight:600;border-bottom:1px solid #edf0ee}
.nav .ni>button svg{color:var(--g7);flex-shrink:0}
.nav .ni>button.on{background:var(--g0);color:var(--g9);box-shadow:inset 4px 0 0 var(--g7)}
.nav .ni>button .badge{margin-left:auto;background:#c9a227;color:#1d1a0b;border-radius:10px;font-size:11.5px;padding:1px 7px}
.nav .sub{background:#f7f9f8;border-bottom:1px solid #edf0ee;padding:4px 0}
.nav .sub button{padding:9px 16px 9px 46px;font-size:14.5px;color:#38423c}
.nav .sub button.on{color:var(--g7);font-weight:700}
.nav .caret{display:none}
.navshade{position:fixed;inset:0;background:rgba(10,20,14,.35);z-index:14}
@media (max-width:899px){
  .nav{position:absolute;left:0;right:0;top:100%;display:none;max-height:calc(100vh - 90px);overflow-y:auto;box-shadow:0 10px 24px rgba(0,0,0,.22);border-radius:0 0 12px 12px}
  .nav.open{display:block}
  .nav .sub{display:none}
  .top{padding:10px 12px}
  .top .lg{width:44px;height:44px}.top .lg img{width:27px;height:33px}
  .top .t2{font-size:14.5px;white-space:normal;line-height:1.2}.top .t3{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .t1,.top .dcs{display:none}
}
@media (min-width:900px){
  .appbar{top:calc(-1 * var(--hh, 79px))}
  .menubtn{display:none!important}

}

table.mini th,table.mini td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}

.brow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}

@media (min-width:900px){.nav.many{gap:0;padding:0 4px}.nav.many .ni>button{padding:13px 9px 11px;font-size:13.5px;gap:6px}.nav.many .ni>button svg:not(.caret){display:none}}

/* ---------- round 2 (08-11-2026): slips page, ECG ticks, ER procedures / medications, certificates ---------- */
@media print{
  body.printing #printArea svg{break-after:page;page-break-after:always}
  body.printing #printArea svg:last-child{break-after:auto;page-break-after:auto}

.tick{display:flex;align-items:center;gap:8px;flex-shrink:0;min-width:118px;min-height:44px;padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}

.upd{display:inline-flex;align-items:center;gap:4px;color:var(--mute)}

.tag.ppr{background:#fff1d6;color:#7a4b00}.tag.online{background:#e6f0fb;color:#14497e}
details.card>summary{cursor:pointer}

  }

      return apiRetry('apiUpdateEntry', sh.id, JSON.stringify(mergeEdit(latest, e, orig))).then(null, function (x) {

    ['mr', 'name', 'age', 'sex', 'cat', 'only', 'petty', 'bp', 'rbs', 'pulse', 'temp', 'spo2', 'wt', 'ht', 'note', 'out', 'outTo', 'obsH', 'signed'].forEach(function (k) { if (str(mine[k]) !== str(orig[k])) m[k] = mine[k]; });
    m.dxs = CEC.dxOf(mine).join('|') !== CEC.dxOf(orig).join('|') ? (mine.dxs || []).slice() : CEC.dxOf(latest);
    ['meds', 'adv'].forEach(function (k) { if ((mine[k] || []).join('|') !== (orig[k] || []).join('|')) m[k] = (mine[k] || []).slice(); });

  function slipLogoBytes() { var bin = atob(SLIP_LOGO.split(',')[1]), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return { bytes: a, w: 300, h: 368 }; }
  /* Paper (11-11-2026): with autoprint on, the shift's setting; otherwise the slip page asks "A4 or A5?" every time it is opened (nothing is remembered),
     and printing from anywhere else asks too. */
  function shiftPaper() { return S.deskPaperLocal || (apOn() ? S.auto.paper : S.view === 'slipq' ? S.paperNow : null); }
  /* The paper autoprint uses on this device. 13-11-2026 evening: the CEC Printer app's choice counts from the moment it arrives (S.deskPaperLocal),
     also during the few seconds before the census has saved it, so nothing prints on the old paper meanwhile. */
  function apPaper() { return normPaper(S.deskPaperLocal || (S.auto && S.auto.paper)); }
  /* Slip paper: 'a5' (1 slip a page), 'a4' (A4 sideways, 2 slips a sheet), 'a4q' (A4 upright, 4 A6 slips a sheet: 13-11-2026). */
  function normPaper(p) { return p === 'a4q' ? 'a4q' : 'a4'; }      // 13-11-2026: A4 only (A5 jammed); an old A5 setting prints 2 slips a sheet
  function paperShort(p) { return p === 'a4q' ? 'A4 \u00d7 4' : p === 'a4' ? 'A4' : 'A5'; }
  function paperPer(p) { return p === 'a4q' ? 4 : p === 'a4' ? 2 : 1; }
  function askPaper() {
    return modal('2 or 4 slips a sheet?', '<p>The slips print on A4 paper.</p><p class="muted small" style="margin:0">2 slips a sheet: cut in the middle (each slip the size of A5). 4 slips a sheet: four small slips, cut in four.</p>',
      [{ label: 'A4: 2 slips a sheet', cls: 'pri', value: 'a4' }, { label: 'A4: 4 slips a sheet', value: 'a4q' }, { label: 'Not now', value: null }], true);
  }
  function withPaper(fn) {
    if (isPhone() && apOn() && !apHere()) return fn(normPaper(S.auto.paper));     // 13-11-2026: sent to the print desk, which uses its own paper
    var p = shiftPaper();
    if (p) return fn(p);
    askPaper().then(function (v) { if (!v) return; if (S.view === 'slipq') { S.paperNow = v; render(); } fn(v); });
  }
  function slipName(e) { return (e.tok || 'Slip').replace(/\s+/g, '_') + '_' + String(e.name || 'patient').replace(/[^A-Za-z0-9]+/g, '_') + '.pdf'; }
  function slipPdfOffer(e, paper) { offerFile(slipName(e), CEC.slipPdf(e, slipLogoBytes(), paper), 'application/pdf', false); }
  function slipsPdfOffer(list, paper) {
    if (list.length === 1) return slipPdfOffer(list[0], paper);
    offerFile('OPD_ER_slips_' + list.length + '_' + CEC.dmy(pkToday()) + '.pdf', CEC.slipPdfMany(list, slipLogoBytes(), paper), 'application/pdf', false);
  }
  var printEnd = null, logoWarm = new Image();
  logoWarm.src = SLIP_LOGO;                                // decoded once, so a slip prints at once
  /* Blank OPD slips (12-11-2026): the standard slip with empty lines, A5 (one a sheet) or A4 (two a sheet), printed or as a PDF. */
  function askBlankSlips() { withDesk(askBlankSlips0); }
  function askBlankSlips0() {
    var lastP = normPaper(store_('cec_blankp'));
    modal('Blank OPD slips', '<p class="muted small">The standard OPD / ER slip with empty lines, to fill by hand.</p>' +
      '<label class="lb" for="bsPaper">Paper</label><select class="in" id="bsPaper"><option value="a4q"' + (lastP === 'a4q' ? ' selected' : '') + '>A4: four small slips a sheet (cut in four)</option><option value="a4"' + (lastP === 'a4' ? ' selected' : '') + '>A4: two slips a sheet (cut in the middle)</option></select>' +
      '<label class="lb" for="bsN">How many slips</label><input class="in" id="bsN" type="number" inputmode="numeric" min="1" max="200" value="20">',
      [{ label: 'Cancel', value: null }, { label: 'Download PDF', value: 'form:pdf' }, { label: 'Print', cls: 'pri', value: 'form:print' }]).then(function (v) {
      if (!v) return;
      var n = Math.round(+v.bsN || 0), paper = normPaper(v.bsPaper);
      if (!(n >= 1 && n <= 200)) return toast('Type a number of slips from 1 to 200.');
      store_('cec_blankp', paper);
      var list = []; for (var i = 0; i < n; i++) list.push({ blank: true });
      if (v._b === 'pdf') return offerFile('Blank_OPD_slips_' + n + '_' + (paper === 'a4q' ? 'A4x4' : paper.toUpperCase()) + '.pdf', CEC.slipPdfMany(list, slipLogoBytes(), paper), 'application/pdf', false);
      if (canDesk()) return deskJob({ kind: 'blankslips', n: n }, n + ' blank OPD slip' + (n === 1 ? '' : 's'));   // on the print desk's own paper
      phoneNoDesk(function () { printSlips(list.map(function (e) { return { e: e }; }), paper, { claimed: true, blank: true }); });

  function pettyLoad() {

  }
  function pettyRows() {
    var P = S.petty, lines = String(P.file ? P.file.text : P.text || '').split(/\r?\n/);
    if (lines.length && /\bname\b/i.test(lines[0]) && /\b(age|gender|sex)\b/i.test(lines[0])) lines.shift();     // the heading line of a file
    return pettyParse(lines.join('\n'));
  }
  /* Add: one tap. A gender that cannot be read or guessed is asked (a long list: those names are left out and shown to correct), a short
     list pasted a second time is caught, and a long list is shown (first and last name) before it is sent. */
  function pettyAdd() {
    var P = S.petty, t = $('ptText'); if (t) P.text = t.value;
    if (P.busy) return;
    if (!P.file && !(P.text || '').trim()) return toast('Paste the names from the register, or choose a file.');
    var rows = pettyRows().filter(function (r) { return r.name.replace(/[^A-Z]/g, '').length >= 2; }), kind = P.kind || 'REG', left = [];
    if (!rows.length) return toast('No name found. One patient on each line.');
    rows.forEach(function (r) { r.kind = kind; });
    var ask = rows.filter(function (r) { return !r.sex; }), step;
    if (!ask.length) step = Promise.resolve(true);
    else if (ask.length <= 30) step = pettyAskSex(ask);
    else step = modal('Male or female?', '<p><b>' + fmtN(ask.length) + '</b> of the ' + fmtN(rows.length) + ' names have no M or F, and the gender could not be told from the name (for example ' +
      h(ask.slice(0, 3).map(function (r) { return r.name; }).join(', ')) + ').</p><p class="small">Leave them out now and add the other ' + fmtN(rows.length - ask.length) + '? The names left out are shown afterwards, to add M or F and add again.</p>',
      [{ label: 'Cancel', value: false }, { label: 'Leave them out', cls: 'pri', value: 'skip' }]).then(function (v) {
        if (v === 'skip') { left = ask.map(function (r) { return r.line; }); rows = rows.filter(function (r) { return r.sex; }); }
        return !!v;
      });
    step.then(function (ok) {
      if (!ok || !rows.length) return;
      if (rows.length <= 500) return pettySend(rows, left, true);
      var lim = (S.pq && S.pq.limit) || 100;
      modal((P.stopped ? 'Carry on sending ' : 'Add ') + fmtN(rows.length) + ' names?', '<p class="small" style="margin:0">First: <b>' + h(ptDesc(rows[0])) + '</b><br>Last: <b>' + h(ptDesc(rows[rows.length - 1])) + '</b></p>' +
        '<p class="small">Category: ' + h(PETTY_L[kind]) + '. Sent in parts of ' + fmtN(PT_PART) + ': keep this page open until it says done. Up to ' + lim + ' names get MR numbers each morning shift, Monday to Saturday, in this order.</p>',
        [{ label: 'Cancel', value: false }, { label: 'Add all ' + fmtN(rows.length), cls: 'pri', value: true }]).then(function (v) { if (v) pettySend(rows, left, false); });
    });
  }
  function pettyAskSex(ask) {
    S.petty.ask = ask;
    var body = '<p class="small" style="margin:0 0 8px">The gender of ' + (ask.length === 1 ? 'this name' : 'these names') + ' could not be read. Tap M or F:</p><div class="ptask">' + ask.map(function (r, i) {
      return '<div class="ptaskr"><span><b>' + h(r.num) + '.</b> ' + h(r.name) + '</span><span class="seg" id="ptAsk' + i + '"><button type="button" data-act="pt-g" data-r="' + i + '" data-v="M">M</button><button type="button" data-act="pt-g" data-r="' + i + '" data-v="F">F</button></span></div>';
    }).join('') + '</div>';
    return modal('Male or female?', body, [{ label: 'Cancel', value: false }, { label: 'Add to the waiting list', cls: 'pri', value: true }]).then(function (ok) {
      if (!ok) return false;

    });

  /* the same list (same names, same order, same category) always gets the same ID, so sending it again only adds the parts not received */
  function pettyHash(rows, kind) {
    var a = 0x811c9dc5, b = 5381, s = kind + '\n' + rows.map(function (r) { return r.name + '|' + r.age + '|' + r.sex; }).join('\n');
    for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); a ^= c; a = Math.imul(a, 16777619) >>> 0; b = (Math.imul(b, 33) + c) >>> 0; }
    return 'P' + a.toString(36) + b.toString(36) + rows.length.toString(36);
  }
  function pettySend(rows, left, check) {
    var P = S.petty, kind = P.kind || 'REG', parts = Math.ceil(rows.length / PT_PART), id = pettyHash(rows, kind), added = 0, again = 0, last = null;
    var sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);      // this sending: a lost answer sent again counts as added
    P.busy = true; P.prog = { sent: 0, total: rows.length }; P.stopped = null; P.result = null; render();
    var send = function (i) {
      if (i >= parts) return Promise.resolve(null);
      var list = rows.slice(i * PT_PART, (i + 1) * PT_PART).map(function (r) { return { name: r.name, age: r.age, sex: r.sex, kind: kind }; });
      return apiRetry('apiAddPetty', JSON.stringify({ paste: { id: id, total: rows.length, parts: parts, kind: kind }, part: i, sid: sid, list: list, check: !!check && parts === 1 })).then(function (r) {
        if (r && r.dups) return r;
        last = r; if (r.again && !r.mine) again += list.length; else added += list.length;
        P.prog.sent = Math.min(rows.length, (i + 1) * PT_PART);
        if (S.view === 'petty' && !anyOverlay()) { var pg = $('ptProg'); if (pg) { pg.querySelector('i').style.width = Math.round(100 * P.prog.sent / P.prog.total) + '%'; pg.querySelector('span').textContent = 'Sending ' + fmtN(P.prog.sent) + ' of ' + fmtN(P.prog.total) + '… keep this page open.'; } }
        return send(i + 1);
      });
    };
    send(0).then(function (r) {
      P.busy = false; P.prog = null;
      if (r && r.dups) { render(); return pettyDups(rows, left, r.dups); }
      P.text = ''; P.file = null; P.stopped = null;
      P.result = { added: added, again: again, waiting: last ? last.waiting : null, est: last ? last.est : '', left: left };
      toast(added ? fmtN(added) + ' name' + (added === 1 ? '' : 's') + ' added to the waiting list.' : 'This list had been added before: nothing added twice.');
      render(); window.scrollTo(0, 0); pettyLoad();
    }, function (x) {
      var sent = P.prog ? P.prog.sent : 0, mrErr = /Automatic MR/.test(errText(x));

      render(); pettyLoad();
      modal(sent ? 'Sending stopped' : 'Not added', '<p>' + (sent ? '<b>' + fmtN(sent) + '</b> of ' + fmtN(rows.length) + ' names were added; the rest were <b>not</b>: ' : 'The names were <b>not added</b>: ') + h(errText(x)) + '</p><p class="small">' +
        (mrErr ? 'Set the automatic MR, then tap Add to the waiting list again.' : 'The list is kept here. Tap Add to the waiting list again: it carries on, nothing is added twice.') + '</p>',
        mrErr ? [{ label: 'Close', value: false }, { label: 'Set automatic MR', cls: 'pri', value: true }] : [{ label: 'OK', cls: 'pri', value: false }]).then(function (v) { if (v) askMr(); });
    });
  }
  function pettyDups(rows, left, dups) {
    var P = S.petty, dset = {}; dups.forEach(function (i) { dset[i] = 1; });
    var dupRows = rows.filter(function (r, i) { return dset[i]; });
    modal('Added already?', '<p><b>' + dupRows.length + '</b> of these ' + rows.length + ' names ' + (dupRows.length === 1 ? 'is' : 'are') + ' already on the waiting list or given an MR today (' + h(PETTY_L[P.kind || 'REG']) + '): ' +
      h(dupRows.slice(0, 6).map(function (r) { return r.name; }).join(', ')) + (dupRows.length > 6 ? '…' : '') + '.</p><p class="small">If the same list was pasted before, add only the new names.</p>',
      [{ label: 'Add only the new names', cls: 'pri', value: 'new' }, { label: 'Add all ' + rows.length, value: 'all' }, { label: 'Cancel', value: null }], true).then(function (v) {

  function pettyFile(f) {

        if (!S.me) return;                                 // signed out (the sign-in has ended)
        renderUserbar(); toast('Could not update: ' + errText(e));
      });
      return;
    }
    loadState().then(function () { S.loaded = true; S.day = currentCensus(); S.view = 'home'; render(); }, startFailed);
    /* 12-11-2026: only an ended sign-in shows the sign-in page. No internet, a busy or slow census: the last saved copy (if any) or a
       "connecting" card, and the census is asked again by itself; the person stays signed in (the phone app is never signed out by this). */
    function startFailed(e) {
      S.loaded = true;
      if (!S.token) { S.me = null; render(); return; }                       // the sign-in has ended (signed out by the census)
      var c2 = cache && cache.st && cache.uid === uid && (cache.view || '') === tokenView(tok) ? cache : null;
      if (c2 && !S.me) { applyState(c2.st); S.offline = !!(e && e.offline) && APP_BUILD; S.stale = true; S.day = currentCensus(); S.view = 'home'; render(); }
      if (S.me) { if (!(e && e.offline)) toast('Could not update: ' + errText(e) + '. Trying again by itself.'); setTimeout(function () { if (S.token && S.stale) loadState().then(function () { S.stale = false; if (!anyOverlay() && !typing()) render(); }, function () { }); }, 15000); return; }
      S.startErr = errText(e); render();
      setTimeout(retryStart, 15000);
    }
    function retryStart() {
      if (!S.token || S.me) return;
      S.startErr = 'Connecting\u2026'; render();
      loadState().then(function () { S.startErr = null; S.day = currentCensus(); S.view = 'home'; render(); }, startFailed);
    }
    S.retryStart = retryStart;
  })();
  S.day = currentCensus();
})();

</script>
